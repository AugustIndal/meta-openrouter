<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Statue of Liberty</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#a9d3ea}
canvas{display:block;width:100vw;height:100vh}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function(){
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
let seed=12345;
function rnd(){seed=(seed*16807)%2147483647;return seed/2147483647;}
function P(pts,fill,stroke){
  ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);
  for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i][0],pts[i][1]);
  ctx.closePath();
  if(fill){ctx.fillStyle=fill;ctx.fill();}
  ctx.strokeStyle=stroke||'rgba(18,48,48,0.14)';ctx.lineWidth=1;ctx.stroke();
}
function limb(x1,y1,x2,y2,w,fill){
  const dx=x2-x1,dy=y2-y1,len=Math.hypot(dx,dy)||1,nx=-dy/len*w/2,ny=dx/len*w/2;
  P([[x1+nx,y1+ny],[x2+nx,y2+ny],[x2-nx,y2-ny],[x1-nx,y1-ny]],fill);
}
function starPts(cx,cy,orx,ory,irx,iry,n){
  const pts=[];
  for(let i=0;i<n*2;i++){
    const a=-Math.PI/2+i*Math.PI/n, o=i%2===0;
    pts.push([cx+Math.cos(a)*(o?orx:irx),cy+Math.sin(a)*(o?ory:iry)]);
  }
  return pts;
}
function flame(cx,top,base,w,fill){
  ctx.beginPath();ctx.moveTo(cx,top);
  ctx.quadraticCurveTo(cx+w,base-2,cx,base);
  ctx.quadraticCurveTo(cx-w,base-2,cx,top);
  ctx.closePath();ctx.fillStyle=fill;ctx.fill();
}
function cloud(cx,cy,s,a){
  ctx.globalAlpha=a;
  P([[cx-90*s,cy],[cx-40*s,cy-28*s],[cx+10*s,cy-18*s],[cx+70*s,cy-30*s],[cx+100*s,cy-4*s],[cx+60*s,cy+12*s],[cx-60*s,cy+10*s]],'#ffffff','rgba(255,255,255,0)');
  P([[cx-40*s,cy+8*s],[cx+20*s,cy-10*s],[cx+70*s,cy+8*s],[cx+10*s,cy+18*s]],'#eef7fb','rgba(255,255,255,0)');
  ctx.globalAlpha=1;
}
function step(x,y,w,h,front,top){
  P([[x,y],[x+w,y],[x+w,y+h],[x,y+h]],front);
  P([[x,y],[x+9,y-8],[x+w-9,y-8],[x+w,y]],top);
  P([[x+w,y],[x+w,y+h],[x+w-9,y+h-8],[x+w-9,y-8]],'#8d8068');
  P([[x,y],[x,y+h],[x+9,y+h-8],[x+9,y-8]],'rgba(255,255,255,0.20)','rgba(255,255,255,0)');
}

function draw(){
  seed=12345;
  const W=canvas.width,H=canvas.height;
  ctx.fillStyle='#a9d3ea';ctx.fillRect(0,0,W,H);
  const s=Math.min(W/1200,H/800);
  ctx.save();ctx.translate((W-1200*s)/2,(H-800*s)/2);ctx.scale(s,s);
  ctx.beginPath();ctx.rect(0,0,1200,800);ctx.clip();

  // Sky
  let sky=ctx.createLinearGradient(0,0,0,560);
  sky.addColorStop(0,'#82c2e6');sky.addColorStop(.55,'#c7e6f2');sky.addColorStop(1,'#f9ecc2');
  ctx.fillStyle=sky;ctx.fillRect(0,0,1200,560);
  let sun=ctx.createRadialGradient(205,135,10,205,135,190);
  sun.addColorStop(0,'rgba(255,244,180,0.95)');sun.addColorStop(.35,'rgba(255,228,140,0.45)');sun.addColorStop(1,'rgba(255,228,140,0)');
  ctx.fillStyle=sun;ctx.fillRect(0,0,460,360);
  P([[180,128],[205,108],[232,128],[205,150]],'#fff3ad','rgba(255,240,170,0)');
  cloud(285,118,1.05,.88);cloud(920,105,.9,.75);cloud(795,185,.62,.55);cloud(150,250,.7,.45);

  // distant shore and skyline
  P([[0,532],[170,508],[340,520],[520,503],[710,518],[890,505],[1060,520],[1200,510],[1200,548],[0,548]],'#8fb6c9','rgba(255,255,255,0)');
  ctx.globalAlpha=.28;ctx.fillStyle='#5f7f96';
  ctx.fillRect(932,482,26,42);ctx.fillRect(962,470,20,54);ctx.fillRect(986,486,30,38);ctx.fillRect(1020,476,18,48);ctx.fillRect(1042,490,26,34);
  ctx.globalAlpha=1;
  P([[0,538],[240,528],[480,536],[720,526],[960,536],[1200,528],[1200,552],[0,552]],'#a8c8d6','rgba(255,255,255,0)');

  // birds
  ctx.strokeStyle='rgba(40,70,90,0.65)';ctx.lineWidth=2;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(340,165);ctx.quadraticCurveTo(352,155,364,165);ctx.quadraticCurveTo(376,155,388,165);ctx.stroke();
  ctx.beginPath();ctx.moveTo(880,225);ctx.quadraticCurveTo(890,217,900,225);ctx.quadraticCurveTo(910,217,920,225);ctx.stroke();

  // Water / harbor
  let wat=ctx.createLinearGradient(0,530,0,800);
  wat.addColorStop(0,'#4aa3cf');wat.addColorStop(.45,'#2b7fb8');wat.addColorStop(1,'#124b7d');
  ctx.fillStyle=wat;ctx.fillRect(0,530,1200,270);
  for(let i=0;i<42;i++){
    const x=rnd()*1120,y=545+rnd()*235,w=46+rnd()*95;
    P([[x,y],[x+w,y-7],[x+w*.55,y+13]],i%3?'rgba(255,255,255,0.09)':'rgba(8,55,105,0.16)','rgba(255,255,255,0)');
  }
  ctx.strokeStyle='rgba(255,255,255,0.16)';ctx.lineWidth=2;
  for(let i=0;i<9;i++){const y=565+i*24;ctx.beginPath();ctx.moveTo(40+i*18,y);ctx.lineTo(360-i*12,y+3);ctx.moveTo(840+i*10,y+4);ctx.lineTo(1160-i*16,y);ctx.stroke();}

  // small distant boat
  P([[944,600],[990,600],[982,612],[952,612]],'#7a4a35');P([[966,600],[966,566],[990,600]],'#ffffff');P([[966,600],[966,574],[950,600]],'#ffd66e');

  // island shadow
  ctx.globalAlpha=.22;ctx.fillStyle='#0b355e';ctx.beginPath();ctx.ellipse(600,688,330,28,0,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;

  // Star-shaped island foundation
  let side=starPts(600,646,332,54,262,38,11).map(p=>[p[0],p[1]+28]);
  P(side,'#5d6b5e');
  let topPts=starPts(600,638,332,54,262,38,11);
  P(topPts,'#8a9a84');
  for(let i=0;i<topPts.length;i++){
    const a=topPts[i],b=topPts[(i+1)%topPts.length];
    P([[600,638],a,b],i%2?'#96a88e':'#7e9079','rgba(40,60,45,0.16)');
  }
  ctx.strokeStyle='rgba(255,255,255,0.28)';ctx.lineWidth=3;
  for(let i=0;i<topPts.length;i+=2){ctx.beginPath();ctx.moveTo(600,638);ctx.lineTo(topPts[i][0],topPts[i][1]);ctx.stroke();}
  ctx.strokeStyle='rgba(30,50,35,0.22)';
  ctx.beginPath();ctx.ellipse(600,638,210,30,0,0,Math.PI*2);ctx.stroke();

  // reflection in front water
  P([[565,700],[635,700],[620,762],[580,762]],'rgba(63,160,142,0.22)','rgba(255,255,255,0)');
  P([[585,708],[615,708],[608,750],[592,750]],'rgba(255,255,255,0.12)','rgba(255,255,255,0)');

  // Pedestal shadow
  ctx.globalAlpha=.25;ctx.fillStyle='#31382f';ctx.beginPath();ctx.ellipse(600,645,165,16,0,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;

  // Stepped stone pedestal
  step(438,668,324,26,'#b3a586','#d8cfb6');
  step(458,646,284,24,'#bdb08f','#ded4ba');
  step(476,622,248,26,'#c6b996','#e4dbc2');
  // main column
  P([[496,474],[704,474],[704,624],[496,624]],'#c0b191');
  P([[496,474],[545,474],[545,624],[496,624]],'#d6cbb0','rgba(255,255,255,0)');
  P([[656,474],[704,474],[704,624],[656,624]],'#95886c','rgba(0,0,0,0)');
  // inset panels
  for(let i=0;i<3;i++){
    const x=520+i*58;
    P([[x,500],[x+42,500],[x+42,592],[x,592]],'#ad9f7d');
    P([[x+7,508],[x+35,508],[x+35,584],[x+7,584]],'#c4b795');
    P([[x+7,508],[x+35,508],[x+35,520],[x+7,520]],'#ded3b8','rgba(255,255,255,0)');
  }
  // cornice and plinth
  step(484,454,232,22,'#c9bd9e','#e8dfc7');
  step(500,434,200,22,'#c2b48f','#e0d5b8');
  // weathering lines
  ctx.strokeStyle='rgba(80,70,50,0.18)';ctx.lineWidth=2;
  for(let i=0;i<5;i++){ctx.beginPath();ctx.moveTo(512+i*42,478);ctx.lineTo(508+i*42,620);ctx.stroke();}

  // Statue shadow on plinth
  ctx.globalAlpha=.28;ctx.fillStyle='#203f3a';ctx.beginPath();ctx.ellipse(600,448,78,10,0,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;

  // Neck
  P([[588,230],[612,230],[612,264],[588,264]],'#2f7f73');

  // Robe base
  P([[546,260],[656,260],[674,452],[528,452]],'#2e7e73');
  P([[546,260],[602,260],[602,452],[528,452]],'#43a592');
  P([[602,260],[656,260],[674,452],[602,452]],'#2a6a61');
  // raised right arm (viewer right) behind shoulder
  limb(646,270,706,212,36,'#2f8576');
  limb(706,212,760,150,27,'#41a08d');
  P([[746,132],[776,132],[772,162],[750,162]],'#4db09b');
  // left arm (viewer left)
  limb(554,270,508,312,38,'#2f8576');
  limb(508,312,480,364,25,'#419d8b');

  // robe folds - low poly facets
  P([[560,268],[574,268],[564,452],[546,452]],'#6fc2ae','rgba(255,255,255,0)');
  P([[582,272],[594,272],[592,452],[578,452]],'#2a6a61','rgba(255,255,255,0)');
  P([[612,272],[624,272],[626,452],[614,452]],'#57b7a3','rgba(255,255,255,0)');
  P([[634,268],[650,268],[662,452],[646,452]],'#245a53','rgba(255,255,255,0)');
  P([[574,350],[602,452],[528,452],[548,380]],'#3a9685');
  P([[628,348],[656,380],[674,452],[604,452]],'#27645c');
  // sash / drapery
  P([[540,292],[658,330],[646,360],[534,320]],'#226257');
  P([[540,292],[658,330],[654,340],[542,302]],'#7fd1c0','rgba(255,255,255,0)');
  P([[552,320],[646,360],[640,372],[550,332]],'#2f7f70');
  // collar
  P([[566,258],[634,258],[646,278],[554,278]],'#2a6a61');
  P([[566,258],[600,258],[600,278],[554,278]],'#8ad0bd','rgba(255,255,255,0)');

  // feet and broken chain
  P([[545,438],[580,438],[584,454],[542,454]],'#2f8576');
  P([[620,438],[658,438],[662,454],[616,454]],'#245a53');
  ctx.strokeStyle='#d9a83c';ctx.lineWidth=4;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(640,448);ctx.quadraticCurveTo(666,438,684,448);ctx.stroke();
  ctx.beginPath();ctx.moveTo(684,448);ctx.quadraticCurveTo(694,458,682,462);ctx.stroke();

  // Head
  P([[576,196],[600,182],[624,196],[621,220],[610,234],[590,234],[579,220]],'#3ea08f');
  P([[576,196],[600,182],[600,234],[590,234],[579,220]],'#63bda9','rgba(255,255,255,0)');
  P([[600,182],[624,196],[621,220],[610,234],[600,234]],'#2f7f73','rgba(255,255,255,0)');
  // hair sides
  P([[578,196],[590,192],[590,228],[580,220]],'#245a53');
  P([[622,196],[610,192],[610,228],[620,220]],'#1e4f49');
  // face shading
  P([[600,202],[607,218],[600,226],[594,218]],'#2f7f73','rgba(255,255,255,0)');
  ctx.strokeStyle='rgba(18,48,45,0.75)';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(586,210);ctx.lineTo(595,210);ctx.moveTo(605,210);ctx.lineTo(614,210);ctx.stroke();
  ctx.beginPath();ctx.moveTo(594,227);ctx.lineTo(606,227);ctx.stroke();

  // Seven-point crown
  ctx.beginPath();ctx.arc(600,210,30,Math.PI,0);ctx.closePath();ctx.fillStyle='#2a6a61';ctx.fill();
  for(let i=0;i<7;i++){
    const a=-Math.PI+i*(Math.PI/6);
    const bx=600+Math.cos(a)*24,by=210+Math.sin(a)*24;
    const tx=600+Math.cos(a)*55,ty=210+Math.sin(a)*55;
    const px=Math.cos(a+Math.PI/2)*8,py=Math.sin(a+Math.PI/2)*8;
    const bx2=600+Math.cos(a)*24,by2=210+Math.sin(a)*24;
    const b1x=600+Math.cos(a)*23+px, b1y=210+Math.sin(a)*23+py;
    const b2x=600+Math.cos(a)*23-px, b2y=210+Math.sin(a)*23-py;
    P([[b1x,b1y],[tx,ty],[b2x,b2y]],i%2?'#3f9c8a':'#2f7f73');
    P([[b1x,b1y],[tx,ty],[600+Math.cos(a)*30,210+Math.sin(a)*30]],i%2?'#8ad0bd':'#57b7a3','rgba(255,255,255,0)');
  }
  // crown band highlight
  ctx.beginPath();ctx.arc(600,210,30,Math.PI*1.15,Math.PI*1.85);ctx.strokeStyle='#8ad0bd';ctx.lineWidth=4;ctx.stroke();

  // Tablet in left hand
  ctx.save();ctx.translate(474,374);ctx.rotate(-0.16);
  P([[-38,-28],[38,-28],[38,28],[-38,28]],'#357a70');
  P([[-30,-20],[30,-20],[30,20],[-30,20]],'#2a655d');
  ctx.strokeStyle='rgba(158,220,205,0.85)';ctx.lineWidth=3;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(-20,-9);ctx.lineTo(20,-9);ctx.moveTo(-20,1);ctx.lineTo(16,1);ctx.moveTo(-20,11);ctx.lineTo(22,11);ctx.stroke();
  ctx.restore();
  P([[452,356],[472,350],[480,370],[460,380]],'#4db09b');

  // Torch
  P([[759,126],[772,126],[772,168],[759,168]],'#8a6b28');
  P([[759,126],[766,126],[766,168],[759,168]],'#c9972f','rgba(255,255,255,0)');
  P([[748,112],[784,112],[777,130],[755,130]],'#c9972f');
  P([[748,112],[784,112],[780,121],[752,121]],'#ffd66e','rgba(255,255,255,0)');
  flame(766,92,116,18,'#f2a91e');
  flame(766,98,114,13,'#ffd23f');
  flame(766,104,112,8,'#fff0a0');

  // Strong side lighting overlays
  P([[546,260],[602,260],[602,452],[528,452]],'rgba(255,255,255,0.13)','rgba(255,255,255,0)');
  P([[602,260],[656,260],[674,452],[602,452]],'rgba(0,35,35,0.16)','rgba(0,0,0,0)');
  P([[496,474],[545,474],[545,624],[496,624]],'rgba(255,255,255,0.16)','rgba(255,255,255,0)');
  P([[656,474],[704,474],[704,624],[656,624]],'rgba(30,30,20,0.18)','rgba(0,0,0,0)');
  P([[646,270],[706,212],[760,150],[748,138],[696,198],[640,256]],'rgba(255,255,255,0.14)','rgba(255,255,255,0)');
  P([[626,290],[674,452],[602,452],[602,290]],'rgba(0,30,30,0.10)','rgba(0,0,0,0)');

  // subtle vignette inside frame
  let vg=ctx.createRadialGradient(600,400,320,600,400,760);
  vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(10,40,60,0.14)');
  ctx.fillStyle=vg;ctx.fillRect(0,0,1200,800);

  ctx.restore();
  window.sceneReady=true;
}
function resize(){canvas.width=window.innerWidth;canvas.height=window.innerHeight;draw();}
window.addEventListener('resize',resize);
resize();
})();
</script>
</body>
</html>
