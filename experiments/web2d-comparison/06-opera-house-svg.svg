<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
<defs>
<linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#fbf7ec"/><stop offset="0.55" stop-color="#e7f0f2"/><stop offset="1" stop-color="#cfe3ee"/>
</linearGradient>
<radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
<stop offset="0" stop-color="#fff8d9" stop-opacity="0.9"/><stop offset="0.5" stop-color="#fff2c2" stop-opacity="0.35"/><stop offset="1" stop-color="#fff2c2" stop-opacity="0"/>
</radialGradient>
<linearGradient id="harborGrad" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#2f6ea6"/><stop offset="0.25" stop-color="#1e5290"/><stop offset="0.6" stop-color="#143d74"/><stop offset="1" stop-color="#0b2a56"/>
