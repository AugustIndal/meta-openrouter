<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pyramidal Stone Tower</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#cfe4f2}
  canvas{display:block}
</style>
</head>
<body>
<script type="module">
import * as THREE from './three.module.js';

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.5));
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xcfe4f2);

const camera = new THREE.PerspectiveCamera(38, window.innerWidth/window.innerHeight, 0.1, 500);
const target = new THREE.Vector3(0,30,0);
let theta = 0.62, phi = 1.18, radius = 132;

function updateCamera(){
  phi = Math.max(0.18, Math.min(1.52, phi));
  radius = Math.max(55, Math.min(210, radius));
  camera.position.set(
    target.x + radius*Math.sin(phi)*Math.sin(theta),
    target.y + radius*Math.cos(phi),
    target.z + radius*Math.sin(phi)*Math.cos(theta)
  );
  camera.lookAt(target);
}

let firstFrame = true;
function renderFrame(){
  renderer.render(scene,camera);
  if(firstFrame){ firstFrame=false; window.sceneReady=true; }
}

/* Lighting */
scene.add(new THREE.HemisphereLight(0xd8ecff, 0x8a8378, 0.95));
const sun = new THREE.DirectionalLight(0xfff1d6, 2.0);
sun.position.set(55,85,38);
sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left=-65; sun.shadow.camera.right=65;
sun.shadow.camera.top=75; sun.shadow.camera.bottom=-25;
sun.shadow.camera.near=10; sun.shadow.camera.far=220;
sun.shadow.bias=-0.0006;
scene.add(sun);
const fill = new THREE.DirectionalLight(0xbcd7f0, 0.45);
fill.position.set(-50,35,-40);
scene.add(fill);

/* Deterministic RNG */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
const rng = mulberry32(12345);

/* Ground, plaza, roads */
const ground = new THREE.Mesh(new THREE.PlaneGeometry(320,320), new THREE.MeshStandardMaterial({color:0xa9a493,roughness:1}));
ground.rotation.x=-Math.PI/2; ground.receiveShadow=true; scene.add(ground);

const roadMat = new THREE.MeshStandardMaterial({color:0x7e7a6e,roughness:1});
for(const [x,z,w,l] of [[0,30,240,6],[0,-30,240,6],[30,0,6,240],[-30,0,6,240]]){
  const r=new THREE.Mesh(new THREE.PlaneGeometry(w,l),roadMat);
  r.rotation.x=-Math.PI/2; r.position.set(x,0.03,z); r.receiveShadow=true; scene.add(r);
}
const plaza = new THREE.Mesh(new THREE.BoxGeometry(48,0.7,48), new THREE.MeshStandardMaterial({color:0xcac2ac,roughness:0.95}));
plaza.position.y=0.35; plaza.receiveShadow=true; plaza.castShadow=true; scene.add(plaza);
const step = new THREE.Mesh(new THREE.BoxGeometry(36,0.6,36), new THREE.MeshStandardMaterial({color:0xd3cbb6,roughness:0.95}));
step.position.y=0.9; step.receiveShadow=true; scene.add(step);

/* Materials */
const stone = new THREE.MeshStandardMaterial({color:0xdfd7c4,roughness:0.88,flatShading:true});
const stoneDark = new THREE.MeshStandardMaterial({color:0xcfc4a9,roughness:0.9,flatShading:true});
const windowMat = new THREE.MeshStandardMaterial({color:0x1f2e3d,roughness:0.32,metalness:0.25});

/* Frustum geometry for 4-sided tower */
function frustum(halfBottom,halfTop,height,yBottom){
  const yb=yBottom, yt=yBottom+height, hb=halfBottom, ht=halfTop;
  const B=[[-hb,yb,-hb],[hb,yb,-hb],[hb,yb,hb],[-hb,yb,hb]];
  const T=[[-ht,yt,-ht],[ht,yt,-ht],[ht,yt,ht],[-ht,yt,ht]];
  const pos=[];
  const quad=(a,b,c,d)=>{pos.push(...a,...b,...c,...a,...c,...d);};
  quad(B[2],B[1],T[1],T[2]); // +X
  quad(B[1],B[0],T[0],T[1]); // -Z
  quad(B[0],B[3],T[3],T[0]); // -X
  quad(B[3],B[2],T[2],T[3]); // +Z
  if(ht>0.08) quad(T[0],T[3],T[2],T[1]);
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.computeVertexNormals();
  return g;
}
function addFrustum(hb,ht,h,y,mat){
  const m=new THREE.Mesh(frustum(hb,ht,h,y),mat||stone);
  m.castShadow=true; m.receiveShadow=true; scene.add(m); return m;
}
addFrustum(10.2,7.4,7.0,0.6,stoneDark);      // broad plinth
addFrustum(7.4,1.6,50,7.6,stone);            // main shaft
addFrustum(1.6,0.06,10,57.6,stone);          // spire
const collar = addFrustum(1.95,1.65,1.4,56.6,stoneDark);
const tip = new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.12,4.5,4),stoneDark);
tip.position.y=69.5; tip.castShadow=true; scene.add(tip);

/* Triangular buttress supports at base */
const triShape = new THREE.Shape();
triShape.moveTo(0,0); triShape.lineTo(7.2,0); triShape.lineTo(0,15.5); triShape.closePath();
const triGeo = new THREE.ExtrudeGeometry(triShape,{depth:2.6,bevelEnabled:false});
triGeo.translate(0,0,-1.3);
const faceDefs=[
  {yaw:-Math.PI/2, dir:[0,1]},
  {yaw:0, dir:[1,0]},
  {yaw:Math.PI/2, dir:[0,-1]},
  {yaw:Math.PI, dir:[-1,0]}
];
for(const f of faceDefs){
  const m=new THREE.Mesh(triGeo,stoneDark);
  m.rotation.y=f.yaw;
  m.position.set(f.dir[0]*6.9,0.6,f.dir[1]*6.9);
  m.castShadow=true; m.receiveShadow=true; scene.add(m);
  // diagonal exposed brace on plinth face
  for(const s of [-1,1]){
    const brace=new THREE.Mesh(new THREE.BoxGeometry(0.45,7.5,0.35),stoneDark);
    const y=4.2, hw=9.2;
    const across=s*2.6;
    let wx,wz;
    if(f.dir[1]===1){wx=across;wz=hw*0.92;}
    else if(f.dir[1]===-1){wx=-across;wz=-hw*0.92;}
    else if(f.dir[0]===1){wx=hw*0.92;wz=-across;}
    else {wx=-hw*0.92;wz=across;}
    brace.position.set(wx,y,wz);
    brace.rotation.y=f.yaw+Math.PI/2;
    brace.rotation.z=s*0.62;
    brace.castShadow=true; scene.add(brace);
  }
}

/* Two narrow vertical fins on opposite upper sides (+X / -X) */
for(const s of [1,-1]){
  const fin=new THREE.Mesh(new THREE.BoxGeometry(3.0,18,1.0),stone);
  fin.position.set(s*4.05,46,0);
  fin.castShadow=true; fin.receiveShadow=true; scene.add(fin);
  const finTip=new THREE.Mesh(new THREE.BoxGeometry(1.6,1.2,0.7),stoneDark);
  finTip.position.set(s*4.3,55.4,0); finTip.castShadow=true; scene.add(finTip);
}

/* Dense dark windows on tapering faces */
function shaftHW(y){return 7.4-(7.4-1.6)*(y-7.6)/50;}
const winGeo=new THREE.PlaneGeometry(0.62,0.92);
const winTransforms=[];
const tilt=Math.atan((7.4-1.6)/50);
for(let y=11;y<=55.5;y+=1.62){
  const hw=shaftHW(y);
  const count=Math.max(1,Math.floor((2*hw-1.7)/1.05));
  for(let f=0;f<4;f++){
    const yaw=f*Math.PI/2;
    for(let i=0;i<count;i++){
      const across=count===1?0:-hw+0.9+(2*hw-1.8)*(i/(count-1));
      winTransforms.push({across,y,hw:hw+0.07,yaw});
    }
  }
}
for(let y=3.4;y<=6.2;y+=1.5){
  const hw=9.4-(9.4-7.4)*(y-0.6)/7;
  const count=9;
  for(let f=0;f<4;f++){
    const yaw=f*Math.PI/2;
    for(let i=0;i<count;i++){
      const across=-hw+0.9+(2*hw-1.8)*(i/(count-1));
      winTransforms.push({across,y,hw:hw+0.07,yaw});
    }
  }
}
const windows=new THREE.InstancedMesh(winGeo,windowMat,winTransforms.length);
const dummy=new THREE.Object3D();
dummy.rotation.order='YXZ';
winTransforms.forEach((t,i)=>{
  const lx=t.across, lz=t.hw;
  dummy.position.set(lx*Math.cos(t.yaw)+lz*Math.sin(t.yaw), t.y, -lx*Math.sin(t.yaw)+lz*Math.cos(t.yaw));
  dummy.rotation.set(-tilt,t.yaw,0);
  dummy.updateMatrix();
  windows.setMatrixAt(i,dummy.matrix);
});
windows.castShadow=false; windows.receiveShadow=true; scene.add(windows);

/* Shorter surrounding city blocks */
const blockData=[];
for(let gx=-5;gx<=5;gx++) for(let gz=-5;gz<=5;gz++){
  const x=gx*15+(rng()-0.5)*5, z=gz*15+(rng()-0.5)*5;
  const d=Math.hypot(x,z);
  if(d<28||d>92) continue;
  if(rng()<0.22) continue;
  blockData.push({x,z,w:6+rng()*5,d:6+rng()*5,h:4+rng()*8.5,c:new THREE.Color().setHSL(0.09+rng()*0.05,0.12+rng()*0.12,0.62+rng()*0.18)});
}
const blockGeo=new THREE.BoxGeometry(1,1,1); blockGeo.translate(0,0.5,0);
const blocks=new THREE.InstancedMesh(blockGeo,new THREE.MeshStandardMaterial({roughness:0.95}),blockData.length);
blockData.forEach((b,i)=>{
  dummy.position.set(b.x,0,b.z); dummy.rotation.set(0,(rng()-0.5)*0.12,0); dummy.scale.set(b.w,b.h,b.d);
  dummy.updateMatrix(); blocks.setMatrixAt(i,dummy.matrix); blocks.setColorAt(i,b.c);
});
dummy.scale.set(1,1,1); dummy.rotation.set(0,0,0);
blocks.castShadow=true; blocks.receiveShadow=true; scene.add(blocks);

/* Small trees */
const treeData=[];
for(let i=0;i<70;i++){
  const a=rng()*Math.PI*2, r=20+ (i%3)*2.2 + rng()*14;
  const x=Math.cos(a)*r, z=Math.sin(a)*r;
  if(Math.abs(x)<32&&Math.abs(z)<32) continue;
  treeData.push({x,z,s:0.85+rng()*0.7});
}
for(let i=0;i<26;i++){
  const x=(rng()-0.5)*160, z=(rng()-0.5)*160;
  if(Math.hypot(x,z)<30||Math.hypot(x,z)>95) continue;
  treeData.push({x,z,s:0.7+rng()*0.6});
}
const trunkGeo=new THREE.CylinderGeometry(0.16,0.2,1.7,6); trunkGeo.translate(0,0.85,0);
const trunks=new THREE.InstancedMesh(trunkGeo,new THREE.MeshStandardMaterial({color:0x6b4f35,roughness:1}),treeData.length);
const folGeo=new THREE.IcosahedronGeometry(1.45,1);
const foliage=new THREE.InstancedMesh(folGeo,new THREE.MeshStandardMaterial({roughness:0.95,flatShading:true}),treeData.length);
treeData.forEach((t,i)=>{
  dummy.position.set(t.x,0,t.z); dummy.rotation.set(0,rng()*Math.PI,0); dummy.scale.setScalar(t.s);
  dummy.updateMatrix(); trunks.setMatrixAt(i,dummy.matrix);
  dummy.position.y=2.1*t.s; dummy.updateMatrix(); foliage.setMatrixAt(i,dummy.matrix);
  foliage.setColorAt(i,new THREE.Color().setHSL(0.28+rng()*0.06,0.38,0.32+rng()*0.12));
});
dummy.scale.set(1,1,1); dummy.position.y=0;
trunks.castShadow=true; foliage.castShadow=true; foliage.receiveShadow=true;
scene.add(trunks); scene.add(foliage);

/* Orbit + zoom interaction */
let dragging=false,lastX=0,lastY=0;
renderer.domElement.addEventListener('pointerdown',e=>{
  dragging=true; lastX=e.clientX; lastY=e.clientY;
  renderer.domElement.setPointerCapture(e.pointerId);
});
renderer.domElement.addEventListener('pointermove',e=>{
  if(!dragging) return;
  theta -= (e.clientX-lastX)*0.0052;
  phi -= (e.clientY-lastY)*0.0052;
  lastX=e.clientX; lastY=e.clientY;
  updateCamera(); renderFrame();
});
renderer.domElement.addEventListener('pointerup',()=>{dragging=false;});
renderer.domElement.addEventListener('pointercancel',()=>{dragging=false;});
renderer.domElement.addEventListener('wheel',e=>{
  e.preventDefault();
  radius *= Math.exp(e.deltaY*0.0011);
  updateCamera(); renderFrame();
},{passive:false});

function onResize(){
  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth,window.innerHeight);
  updateCamera(); renderFrame();
}
window.addEventListener('resize',onResize);

updateCamera();
renderFrame();
</script>
</body>
</html>
