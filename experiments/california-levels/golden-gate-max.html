<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Suspension Bridge Illustration</title>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#bcdcf0}
canvas{display:block;touch-action:none}
</style>
</head>
<body>
<script type="module">
import * as THREE from './three.module.js';

const INITIAL_WIDTH = 1200;
const INITIAL_HEIGHT = 800;
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
renderer.setSize(window.innerWidth || INITIAL_WIDTH, window.innerHeight || INITIAL_HEIGHT);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xbcdcf0);
scene.fog = new THREE.Fog(0xd9edf5, 420, 1150);

const camera = new THREE.PerspectiveCamera(40, (window.innerWidth || INITIAL_WIDTH) / (window.innerHeight || INITIAL_HEIGHT), 1, 3500);

let seed = 20240607;
function rand(){
  seed = (seed * 1664525 + 1013904223) >>> 0;
  return seed / 4294967296;
}

const hemi = new THREE.HemisphereLight(0xcfe8ff, 0x4a6a4a, 0.85);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff1d6, 2.3);
sun.position.set(260, 300, 180);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -380;
sun.shadow.camera.right = 380;
sun.shadow.camera.top = 220;
sun.shadow.camera.bottom = -160;
sun.shadow.camera.near = 40;
sun.shadow.camera.far = 900;
sun.shadow.bias = -0.0005;
sun.shadow.normalBias = 2;
scene.add(sun);
scene.add(sun.target);
const fill = new THREE.DirectionalLight(0xbcd9ff, 0.55);
fill.position.set(-220, 130, -180);
scene.add(fill);

const skyGeo = new THREE.SphereGeometry(1200, 32, 16);
const skyPos = skyGeo.attributes.position;
const skyColors = [];
const topColor = new THREE.Color(0x69aed8);
const horizonColor = new THREE.Color(0xeaf4f8);
const tmpColor = new THREE.Color();
for (let i = 0; i < skyPos.count; i++){
  const y = skyPos.getY(i);
  const t = THREE.MathUtils.clamp((y / 1200 + 1) / 2, 0, 1);
  tmpColor.lerpColors(horizonColor, topColor, Math.pow(t, 0.65));
  skyColors.push(tmpColor.r, tmpColor.g, tmpColor.b);
}
skyGeo.setAttribute('color', new THREE.Float32BufferAttribute(skyColors, 3));
const sky = new THREE.Mesh(skyGeo, new THREE.MeshBasicMaterial({ vertexColors:true, side:THREE.BackSide, fog:false, depthWrite:false }));
scene.add(sky);

const vermilionMat = new THREE.MeshStandardMaterial({ color:0xc12f22, roughness:0.55, metalness:0.18 });
const concreteMat = new THREE.MeshStandardMaterial({ color:0xa8adb0, roughness:0.9, metalness:0.02 });
const cableMat = new THREE.MeshStandardMaterial({ color:0x2b2f33, roughness:0.5, metalness:0.4 });
const roadMat = new THREE.MeshStandardMaterial({ color:0x3b4046, roughness:0.92, metalness:0.02 });
const waterMat = new THREE.MeshPhongMaterial({ color:0x23709f, shininess:120, specular:0x9fd0e8 });
const hillMat = new THREE.MeshStandardMaterial({ color:0x598044, roughness:1, flatShading:true });
const farHillMat = new THREE.MeshStandardMaterial({ color:0x7ea794, roughness:1, flatShading:true });
const rockMat = new THREE.MeshStandardMaterial({ color:0x7d807c, roughness:1, flatShading:true });
const greenDarkMat = new THREE.MeshStandardMaterial({ color:0x38692f, roughness:1, flatShading:true });
const whiteMat = new THREE.MeshStandardMaterial({ color:0xf2f5f6, roughness:0.8 });
const lampMat = new THREE.MeshStandardMaterial({ color:0xfff3c0, emissive:0xffd98a, emissiveIntensity:0.35, roughness:0.4 });

const deckTop = 21.35;
const towerX = 120;
const towerY = 106;
const sagY = 27;
const anchorX = 205;
const anchorY = 40;

function cableY(x){
  const ax = Math.abs(x);
  if (ax <= towerX) return sagY + (towerY - sagY) * Math.pow(x / towerX, 2);
  const t = (ax - towerX) / (anchorX - towerX);
  return towerY + (anchorY - towerY) * Math.pow(t, 0.85);
}

const bridge = new THREE.Group();
scene.add(bridge);

function addBox(w, h, d, x, y, z, mat, parent){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z);
  m.castShadow = true;
  m.receiveShadow = true;
  (parent || bridge).add(m);
  return m;
}

function createTower(x){
  addBox(10, 9, 22, x, 2, 0, concreteMat);
  for (const z of [-7, 7]) addBox(4.8, 104, 3.6, x, 54, z, vermilionMat);
  const levels = [16, 40, 64, 88];
  for (const y of levels) addBox(4.3, 3.8, 17.6, x, y, 0, vermilionMat);
  addBox(4.5, 4.0, 17.8, x, 102, 0, vermilionMat);
  addBox(5.6, 2.6, 18, x, 107, 0, vermilionMat);
  const intervals = [[16,40],[40,64],[64,88],[88,102]];
  for (const pair of intervals){
    const y1 = pair[0], y2 = pair[1];
    const dy = y2 - y1;
    const dz = 14;
    const len = Math.sqrt(dy * dy + dz * dz);
    const ang = Math.atan2(dz, dy);
    const midY = (y1 + y2) / 2;
    for (const s of [1, -1]){
      const brace = new THREE.Mesh(new THREE.BoxGeometry(1.9, len, 1.5), vermilionMat);
      brace.position.set(x, midY, 0);
      brace.rotation.x = ang * s;
      brace.castShadow = true;
      brace.receiveShadow = true;
      bridge.add(brace);
    }
  }
}
createTower(-towerX);
createTower(towerX);

addBox(440, 2.2, 16.5, 0, 20, 0, vermilionMat);
addBox(440, 0.25, 14, 0, 21.22, 0, roadMat);
for (const z of [-8.2, 8.2]){
  addBox(440, 1.8, 0.8, 0, 21.6, z, vermilionMat);
  addBox(440, 0.35, 0.5, 0, 22.7, z, vermilionMat);
  addBox(440, 1.6, 1.2, 0, 18.2, z * 0.67, cableMat);
}
addBox(22, 19, 23, -200, 27, 0, concreteMat);
addBox(22, 19, 23, 200, 27, 0, concreteMat);

const dummy = new THREE.Object3D();

const crossGeo = new THREE.BoxGeometry(1.1, 1.4, 15.4);
const crossCount = 21;
const crossMesh = new THREE.InstancedMesh(crossGeo, cableMat, crossCount);
for (let i = 0; i < crossCount; i++){
  dummy.position.set(-210 + i * 21, 18.4, 0);
  dummy.scale.set(1, 1, 1);
  dummy.rotation.set(0, 0, 0);
  dummy.updateMatrix();
  crossMesh.setMatrixAt(i, dummy.matrix);
}
crossMesh.castShadow = true;
bridge.add(crossMesh);

const dashGeo = new THREE.BoxGeometry(2.6, 0.08, 0.45);
const dashPositions = [];
for (let x = -207; x <= 207; x += 9) dashPositions.push(x);
const dashMesh = new THREE.InstancedMesh(dashGeo, whiteMat, dashPositions.length);
for (let i = 0; i < dashPositions.length; i++){
  dummy.position.set(dashPositions[i], 21.38, 0);
  dummy.scale.set(1, 1, 1);
  dummy.rotation.set(0, 0, 0);
  dummy.updateMatrix();
  dashMesh.setMatrixAt(i, dummy.matrix);
}
bridge.add(dashMesh);

const poleGeo = new THREE.CylinderGeometry(0.14, 0.14, 5.2, 6);
const headGeo = new THREE.SphereGeometry(0.45, 8, 6);
let lampIndex = 0;
for (let x = -180; x <= 180; x += 60){
  const z = (lampIndex % 2 === 0) ? 7.6 : -7.6;
  const pole = new THREE.Mesh(poleGeo, cableMat);
  pole.position.set(x, deckTop + 2.6, z);
  pole.castShadow = true;
  bridge.add(pole);
  const head = new THREE.Mesh(headGeo, lampMat);
  head.position.set(x, deckTop + 5.3, z);
  bridge.add(head);
  lampIndex++;
}

for (const z of [-7, 7]){
  const points = [];
  for (let x = -205; x <= 205.01; x += 8.2) points.push(new THREE.Vector3(x, cableY(x), z));
  const curve = new THREE.CatmullRomCurve3(points);
  const tube = new THREE.Mesh(new THREE.TubeGeometry(curve, 120, 0.5, 6, false), cableMat);
  tube.castShadow = true;
  bridge.add(tube);
}

const hangersData = [];
function addHangers(xStart, xEnd, step){
  for (let x = xStart; x <= xEnd + 0.01; x += step){
    const top = cableY(x);
    const len = top - deckTop;
    if (len < 1) continue;
    for (const z of [-7, 7]) hangersData.push({ x:x, z:z, len:len });
  }
}
addHangers(-112, 112, 8);
addHangers(-200, -128, 12);
addHangers(128, 200, 12);
const hangerGeo = new THREE.CylinderGeometry(0.13, 0.13, 1, 5);
const hangerMesh = new THREE.InstancedMesh(hangerGeo, cableMat, hangersData.length);
for (let i = 0; i < hangersData.length; i++){
  const d = hangersData[i];
  dummy.position.set(d.x, deckTop + d.len / 2, d.z);
  dummy.scale.set(1, d.len, 1);
  dummy.rotation.set(0, 0, 0);
  dummy.updateMatrix();
  hangerMesh.setMatrixAt(i, dummy.matrix);
}
bridge.add(hangerMesh);

const waterGeo = new THREE.PlaneGeometry(1500, 900, 64, 36);
waterGeo.rotateX(-Math.PI / 2);
const wp = waterGeo.attributes.position;
for (let i = 0; i < wp.count; i++){
  const x = wp.getX(i), z = wp.getZ(i);
  wp.setY(i, Math.sin(x * 0.032) * 0.5 + Math.cos(z * 0.04) * 0.45 + Math.sin((x + z) * 0.017) * 0.35);
}
waterGeo.computeVertexNormals();
const water = new THREE.Mesh(waterGeo, waterMat);
water.position.y = 0;
water.receiveShadow = true;
scene.add(water);

function makeHill(cx, cz, sx, sy, sz, mat){
  const geo = new THREE.IcosahedronGeometry(1, 2);
  const pos = geo.attributes.position;
  const v = new THREE.Vector3();
  for (let i = 0; i < pos.count; i++){
    v.fromBufferAttribute(pos, i);
    const f = 0.9 + 0.18 * Math.sin(v.x * 10 + v.y * 5) * Math.cos(v.z * 8 - v.x * 3);
    pos.setXYZ(i, v.x * f, v.y * f, v.z * f);
  }
  geo.computeVertexNormals();
  const mesh = new THREE.Mesh(geo, mat);
  mesh.scale.set(sx, sy, sz);
  mesh.position.set(cx, -sy * 0.2, cz);
  mesh.receiveShadow = true;
  scene.add(mesh);
  return mesh;
}
makeHill(-275, 0, 115, 38, 96, hillMat);
makeHill(275, 0, 115, 38, 96, hillMat);
makeHill(-230, -350, 220, 36, 80, farHillMat);
makeHill(260, -370, 260, 46, 90, farHillMat);

const rockGeoA = new THREE.DodecahedronGeometry(1, 0);
const rockGeoB = new THREE.IcosahedronGeometry(1, 0);

const rockSpecs = [];
let attempts = 0;
while (rockSpecs.length < 66 && attempts < 300){
  attempts++;
  const side = rand() > 0.5 ? 1 : -1;
  const cx = side * 275;
  const x = cx + (rand() - 0.5) * 200;
  const z = (rand() - 0.5) * 180;
  if (Math.abs(z) < 13) continue;
  const d = Math.pow((x - cx) / 115, 2) + Math.pow(z / 96, 2);
  if (d > 1) continue;
  const y = -7.6 + 38 * Math.sqrt(Math.max(0, 1 - d)) * 0.92;
  const s = 2.5 + rand() * 5;
  rockSpecs.push({ x:x, y:y + s * 0.2, z:z, s:s, r:rand() * Math.PI * 2, g:rand() });
}
for (const spec of rockSpecs){
  const rock = new THREE.Mesh(rand() > 0.5 ? rockGeoA : rockGeoB, spec.g > 0.78 ? greenDarkMat : rockMat);
  rock.position.set(spec.x, spec.y, spec.z);
  rock.scale.set(spec.s, spec.s * 0.75, spec.s);
  rock.rotation.set(spec.r, spec.r * 1.3, spec.r * 0.7);
  rock.receiveShadow = true;
  scene.add(rock);
}

for (const tx of [-120, 120]){
  for (let i = 0; i < 5; i++){
    const rock = new THREE.Mesh(rockGeoA, rockMat);
    const s = 2.5 + rand() * 2.5;
    rock.position.set(tx + (rand() - 0.5) * 18, 0.4, (rand() > 0.5 ? 14 : -14) + rand() * 8);
    rock.scale.set(s, s * 0.6, s);
    rock.rotation.set(rand() * 3, rand() * 3, rand() * 3);
    rock.receiveShadow = true;
    scene.add(rock);
  }
}

const shrubSpecs = [];
attempts = 0;
while (shrubSpecs.length < 130 && attempts < 600){
  attempts++;
  const side = rand() > 0.5 ? 1 : -1;
  const cx = side * 275;
  const x = cx + (rand() - 0.5) * 190;
  const z = (rand() - 0.5) * 170;
  if (Math.abs(z) < 16) continue;
  const d = Math.pow((x - cx) / 115, 2) + Math.pow(z / 96, 2);
  if (d > 0.82) continue;
  const y = -7.6 + 38 * Math.sqrt(Math.max(0, 1 - d)) * 0.95 + 1;
  shrubSpecs.push({ x:x, y:y, z:z, s:1.8 + rand() * 2.4, r:rand() * Math.PI * 2 });
}
const shrubGeo = new THREE.ConeGeometry(1, 2.2, 6);
const shrubMesh = new THREE.InstancedMesh(shrubGeo, greenDarkMat, shrubSpecs.length);
for (let i = 0; i < shrubSpecs.length; i++){
  const s = shrubSpecs[i];
  dummy.position.set(s.x, s.y + s.s * 0.7, s.z);
  dummy.scale.set(s.s, s.s, s.s);
  dummy.rotation.set(0, s.r, 0);
  dummy.updateMatrix();
  shrubMesh.setMatrixAt(i, dummy.matrix);
}
scene.add(shrubMesh);

const target = new THREE.Vector3(0, 36, 0);
let radius = 680;
let theta = 0.78;
let phi = 1.12;

function updateCamera(){
  const x = target.x + radius * Math.sin(phi) * Math.sin(theta);
  const y = target.y + radius * Math.cos(phi);
  const z = target.z + radius * Math.sin(phi) * Math.cos(theta);
  camera.position.set(x, y, z);
  camera.lookAt(target);
}
function renderScene(){
  renderer.render(scene, camera);
}
updateCamera();
renderScene();
window.sceneReady = true;

const canvas = renderer.domElement;
let isDragging = false;
let lastX = 0;
let lastY = 0;
canvas.addEventListener('pointerdown', (e) => {
  isDragging = true;
  lastX = e.clientX;
  lastY = e.clientY;
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove', (e) => {
  if (!isDragging) return;
  const dx = e.clientX - lastX;
  const dy = e.clientY - lastY;
  lastX = e.clientX;
  lastY = e.clientY;
  theta -= dx * 0.005;
  phi = THREE.MathUtils.clamp(phi - dy * 0.005, 0.45, 1.45);
  updateCamera();
  renderScene();
});
function endDrag(){ isDragging = false; }
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);
canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  radius = THREE.MathUtils.clamp(radius * (1 + e.deltaY * 0.001), 260, 1050);
  updateCamera();
  renderScene();
}, { passive:false });

window.addEventListener('resize', () => {
  const w = window.innerWidth || INITIAL_WIDTH;
  const h = window.innerHeight || INITIAL_HEIGHT;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
  updateCamera();
  renderScene();
});
</script>
</body>
</html>
