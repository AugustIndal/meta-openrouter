let seed = 987654321;
function rand(){ seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; }

const HILL_TOP = 11;
function hillHeight(x,z){
  const ex = x/44, ez = z/48;
  const r = Math.sqrt(ex*ex + ez*ez);
  const plateau = 0.65;
  if(r <= plateau) return HILL_TOP;
  if(r >= 1) return 0;
  const t = (r-plateau)/(1-plateau);
  const s = 0.5 + 0.5*Math.cos(Math.PI*t);
  return HILL_TOP * Math.pow(s,0.9);
}

// Sky dome with vertex gradient
{
  const g = new THREE.SphereGeometry(340,32,16);
  const p = g.attributes.position;
  const cols = new Float32Array(p.count*3);
  const top = new THREE.Color(0x69aed6), mid = new THREE.Color(0xbcd9ec), hor = new THREE.Color(0xf2ead2), tmp = new THREE.Color();
  for(let i=0;i<p.count;i++){
    const f = Math.max(0, Math.min(1, p.getY(i)/340));
    if(f < 0.35) tmp.copy(hor).lerp(mid, f/0.35); else tmp.copy(mid).lerp(top,(f-0.35)/0.65);
    cols[i*3]=tmp.r; cols[i*3+1]=tmp.g; cols[i*3+2]=tmp.b;
  }
  g.setAttribute('color', new THREE.BufferAttribute(cols,3));
  const sky = new THREE.Mesh(g, new THREE.MeshBasicMaterial({vertexColors:true, side:THREE.BackSide, depthWrite:false}));
  scene.add(sky);
}

function makeBox(w,h,d,mat,x,y,z){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat);
  m.position.set(x,y,z); m.castShadow = true; m.receiveShadow = true; scene.add(m); return m;
}
function makeCylinder(rt,rb,h,mat,x,y,z,seg=24){
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg), mat);
  m.position.set(x,y,z); m.castShadow = true; m.receiveShadow = true; scene.add(m); return m;
}
function makeSphere(r,mat,x,y,z){
  const m = new THREE.Mesh(new THREE.SphereGeometry(r,20,14), mat);
  m.position.set(x,y,z); m.castShadow = true; m.receiveShadow = true; scene.add(m); return m;
}
function makeTorus(r,tube,mat,x,y,z){
  const m = new THREE.Mesh(new THREE.TorusGeometry(r,tube,8,44), mat);
  m.rotation.x = Math.PI/2; m.position.set(x,y,z); m.castShadow = true; m.receiveShadow = true; scene.add(m); return m;
}

function farHill(x,z,sx,sy,sz,col){

}

// Distant city, instanced
{
  const list = [];
  const palette = [0xcbbfa3,0xb8b0a0,0xd0c0a8,0xa8a898,0xc2b49a,0xb5a88f];
  for(let i=0;i<210;i++){
    let x,z;
    if(i%3===0){ x = (rand()<0.5?-1:1)*(58+rand()*38); z = -32+rand()*72; }
    else { x = -98+rand()*196; z = -58-rand()*56; }
    if(Math.sqrt(Math.pow(x/50,2)+Math.pow(z/54,2)) < 1.12) continue;
    list.push({x,z,w:3+rand()*4,h:2.5+rand()*8.5,d:3+rand()*4,c:palette[Math.floor(rand()*palette.length)]});
  }
  const mesh = new THREE.InstancedMesh(new THREE.BoxGeometry(1,1,1), new THREE.MeshStandardMaterial({roughness:0.95}), list.length);
  const dummy = new THREE.Object3D(); const col = new THREE.Color();
  list.forEach((b,i)=>{
    dummy.position.set(b.x,b.h/2-0.2,b.z); dummy.scale.set(b.w,b.h,b.d); dummy.rotation.set(0,0,0); dummy.updateMatrix();
    mesh.setMatrixAt(i,dummy.matrix); mesh.setColorAt(i,col.setHex(b.c));
  });
  mesh.instanceMatrix.needsUpdate = true; if(mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
  mesh.receiveShadow = true; scene.add(mesh);
}

// Hill with vertex colours
{
  const g = new THREE.PlaneGeometry(180,180,72,72); g.rotateX(-Math.PI/2);
  const p = g.attributes.position;
  const cols = new Float32Array(p.count*3);
  const top = new THREE.Color(0x7c9a4e), mid = new THREE.Color(0x8f8a4f), low = new THREE.Color(0x8f7350), tmp = new THREE.Color();
  for(let i=0;i<p.count;i++){
    const x=p.getX(i), z=p.getZ(i), h=hillHeight(x,z); p.setY(i,h);
    const t=h/HILL_TOP;
    if(t>0.55) tmp.copy(mid).lerp(top,(t-0.55)/0.45); else tmp.copy(low).lerp(mid,t/0.55);
    const n = Math.sin(x*0.37+1.7)*Math.cos(z*0.41-0.6)*0.045;
    tmp.offsetHSL(0,0,n);
    cols[i*3]=tmp.r; cols[i*3+1]=tmp.g; cols[i*3+2]=tmp.b;
  }
  g.setAttribute('color', new THREE.BufferAttribute(cols,3));
  g.computeVertexNormals();
  const m = new THREE.Mesh(g, new THREE.MeshStandardMaterial({vertexColors:true, roughness:1}));
  m.receiveShadow = true; scene.add(m);
}

// Domes
function createDome(cx,roofY,cz,drumR,drumH,domeR){
  makeCylinder(drumR,drumR*1.06,drumH,matCreamDark,cx,roofY+drumH/2,cz,28);
  makeTorus(drumR+0.08,0.14,matCopperDark,cx,roofY+drumH,cz);
  const geo = new THREE.SphereGeometry(domeR,36,18,0,Math.PI*2,0,Math.PI/2);
  const dome = new THREE.Mesh(geo,matCopper);
  dome.scale.y=1.08; dome.position.set(cx,roofY+drumH,cz); dome.castShadow=true; dome.receiveShadow=true; scene.add(dome);
  [0.38,0.68].forEach(f=>{
    const hr = domeR*1.08*f; const cr = domeR*Math.sqrt(1-f*f);
    makeTorus(cr,0.05,matCopperDark,cx,roofY+drumH+hr,cz);
  });
  makeCylinder(0.1,0.15,0.7,matCopperDark,cx,roofY+drumH+domeR*1.08+0.3,cz,10);
  makeSphere(0.26,matCopperDark,cx,roofY+drumH+domeR*1.08+0.78,cz);
  const n = domeR>4?10:7;
  for(let i=0;i<n;i++){
    const a=i/n*Math.PI*2+0.3;
    const win = makeBox(0.55,0.85,0.12,matGlass,cx+Math.sin(a)*(drumR+0.03),roofY+drumH*0.55,cz+Math.cos(a)*(drumR+0.03));
    win.rotation.y=a;
  }
}

function addWindow(x,y,z,ry=0,w=1.05,h=1.65){
  const g = makeBox(w,h,0.14,matGlass,x,y,z); g.rotation.y=ry;
  const sill = makeBox(w+0.3,0.16,0.26,matStone,x,y-h/2-0.09,z); sill.rotation.y=ry;
}
