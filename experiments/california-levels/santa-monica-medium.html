<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pier Scene</title>
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#8ecfee}
  canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<script type="module">
import * as THREE from './three.module.js';

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 1.5));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x8ecfee);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 300);
const target = new THREE.Vector3(0, 3.2, -2);
let theta = 0.62, phi = 1.02, radius = 52;

function updateCamera(){
  const x = target.x + radius * Math.sin(phi) * Math.sin(theta);
  const y = target.y + radius * Math.cos(phi);
  const z = target.z + radius * Math.sin(phi) * Math.cos(theta);
  camera.position.set(x,y,z);
  camera.lookAt(target);
}
function render(){
  updateCamera();
  renderer.render(scene, camera);
  if(!window.sceneReady){ window.sceneReady = true; }
}

// lights
scene.add(new THREE.HemisphereLight(0xbfe8ff, 0xe8d5a3, 0.95));
const sun = new THREE.DirectionalLight(0xfff2d6, 2.1);
sun.position.set(22, 32, 18);
sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left=-40; sun.shadow.camera.right=40;
sun.shadow.camera.top=40; sun.shadow.camera.bottom=-40;
sun.shadow.camera.far=100;
scene.add(sun);
const fill = new THREE.DirectionalLight(0x9fd4ff, 0.5);
fill.position.set(-20,14,-18);
scene.add(fill);

// helpers
function mat(c, r=0.85){ return new THREE.MeshStandardMaterial({color:c, roughness:r, metalness:0.05}); }
function box(w,h,d,c,x=0,y=0,z=0,ry=0){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat(c));
  m.position.set(x,y,z); m.rotation.y=ry; m.castShadow=true; m.receiveShadow=true; return m;
}
function cyl(rt,rb,h,c,x=0,y=0,z=0,seg=10){
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg), mat(c));
  m.position.set(x,y,z); m.castShadow=true; m.receiveShadow=true; return m;
}
function pseudo(i){ const v=Math.sin(i*12.9898)*43758.5453; return v-Math.floor(v); }

// sand and ocean
const sand = new THREE.Mesh(new THREE.PlaneGeometry(110,38), mat(0xe9d79f,1));
sand.rotation.x=-Math.PI/2; sand.position.set(0,0,22); sand.receiveShadow=true; scene.add(sand);
const ocean = new THREE.Mesh(new THREE.PlaneGeometry(110,68), mat(0x1b7fbf,0.45));
ocean.rotation.x=-Math.PI/2; ocean.position.set(0,-0.35,-18); ocean.receiveShadow=true; scene.add(ocean);
// shallower water strip
const shallow = new THREE.Mesh(new THREE.PlaneGeometry(110,10), mat(0x3aaed6,0.5));
shallow.rotation.x=-Math.PI/2; shallow.position.set(0,-0.18,13); scene.add(shallow);

// foamy shoreline
for(let i=0;i<70;i++){
  const x=-48+i*1.4 + (pseudo(i)-0.5)*0.7;
  const z=13.5 + Math.sin(i*0.55)*1.1 + pseudo(i+20)*1.2;
  const s=new THREE.Mesh(new THREE.SphereGeometry(0.7+pseudo(i+5)*0.9,8,6), mat(0xffffff,1));
  s.scale.set(1.4,0.18,0.9); s.position.set(x,-0.05,z); s.receiveShadow=true; scene.add(s);
}
// foamy patches in ocean
for(let i=0;i<28;i++){
  const x=-42+pseudo(i+40)*84, z=-28+pseudo(i+60)*34;
  const f=new THREE.Mesh(new THREE.SphereGeometry(0.9+pseudo(i)*1.6,8,6), mat(0xeafcff,1));
  f.scale.set(2,0.12,0.8); f.position.set(x,-0.12,z); scene.add(f);
}

// deck level
const DECK=2.4;
// main pier
scene.add(box(6,0.6,40,0x9a6b3f,0,DECK,-1));
scene.add(box(16,0.6,12,0xa47444,0,DECK,-16)); // end platform
scene.add(box(13,0.6,13,0xa47444,9.5,DECK,2)); // side platform for coaster
// deck planks lines
for(let z=-20;z<19;z+=1.2){
  scene.add(box(6.02,0.06,0.12,0x7e552e,0,DECK+0.32,z));
  scene.add(box(16.02,0.06,0.12,0x7e552e,0,DECK+0.32,-10.5+((z+20)%12)));
}
// timber piles
function piles(cx,cz,w,l){
  for(let x=-w/2+0.6;x<=w/2-0.5;x+=2.4){
    for(let z=-l/2+0.6;z<=l/2-0.5;z+=4){
      if(Math.abs(x)<0.1 && Math.abs(z)<0.1) continue;
      scene.add(cyl(0.20,0.24,4.2,0x6b4423,cx+x,0.6,cz+z,8));
      // foam ring at water
      const ring=new THREE.Mesh(new THREE.TorusGeometry(0.55,0.10,6,14), mat(0xffffff,1));
      ring.rotation.x=Math.PI/2; ring.position.set(cx+x,0.02,cz+z); scene.add(ring);
    }
  }
}
piles(0,-1,6,40); piles(0,-16,16,12); piles(9.5,2,13,13);

// railings
function railing(x1,z1,x2,z2){
  const len=Math.hypot(x2-x1,z2-z1);
  const ang=Math.atan2(x2-x1,z2-z1);
  const midx=(x1+x2)/2, midz=(z1+z2)/2;
  const top=box(0.12,0.12,len,0x5d3a1e,midx,DECK+1.35,midz); top.rotation.y=ang; scene.add(top);
  const mid=box(0.08,0.08,len,0x5d3a1e,midx,DECK+0.85,midz); mid.rotation.y=ang; scene.add(mid);
  const n=Math.max(2,Math.floor(len/2));
  for(let i=0;i<=n;i++){
    const t=i/n;
    scene.add(cyl(0.05,0.05,1.1,0x6b4423,x1+(x2-x1)*t,DECK+0.85,z1+(z2-z1)*t,6));
  }
}
railing(-2.9,18,-2.9,-10); railing(2.9,18,2.9,-10);
railing(-8,-9.9,-8,-22); railing(8,-9.9,8,-22); railing(-8,-22,8,-22);
railing(3.2,8.5,16.2,8.5); railing(16.2,8.5,16.2,-4.5);
railing(3.2,8.5,3.2,-4.5);

// low buildings on beach
function building(x,z,w,d,h,c,rc){
  scene.add(box(w,h,d,c,x,h/2,z));
  const roof=new THREE.Mesh(new THREE.ConeGeometry(Math.max(w,d)*0.72,1.6,4), mat(rc,0.7));
  roof.position.set(x,h+0.8,z); roof.rotation.y=Math.PI/4; roof.castShadow=true; scene.add(roof);
  scene.add(box(w*0.35,1.1,0.1,0xffffff,x,1.1,z-d/2-0.06));
}
building(-18,26,9,6,3.2,0xfff0d6,0xe76f51);
building(-7,27,7,5,2.6,0xffd6a5,0x2a9d8f);
building(11,26,10,6,3.0,0xcfe8ff,0xe76f51);
building(20,27,6,5,2.4,0xffe8f0,0xf4a261);
building(-26,27,6,5,2.4,0xd8f3dc,0x457b9d);
// small kiosks on pier
scene.add(box(3,2,2.4,0xffe8b6,-6,DECK+1.3,-11));
scene.add(box(3.4,0.3,2.8,0xe76f51,-6,DECK+2.45,-11));
scene.add(box(2.6,1.8,2.2,0xbfe8ff,5.8,DECK+1.2,-20));
scene.add(box(3,0.3,2.6,0x2a9d8f,5.8,DECK+2.25,-20));
scene.add(box(2.8,2,2.4,0xffd6a5,14,DECK+1.3,6.5));
scene.add(box(3.2,0.3,2.8,0x457b9d,14,DECK+2.45,6.5));

// Ferris wheel
const ferris = new THREE.Group();
ferris.position.set(-3.2, DECK+7.2, -16);
ferris.rotation.y = Math.PI/2;
scene.add(ferris);
const FR=5.6;
const rimCols=[0xe63946,0xffb703,0x2a9d8f,0x4361ee,0xf72585,0x06d6a0,0xff8c42,0x8338ec];
for(let i=0;i<8;i++){
  const seg=new THREE.Mesh(new THREE.TorusGeometry(FR,0.16,8,14,Math.PI/4), mat(rimCols[i],0.55));
  seg.rotation.z=i*Math.PI/4; seg.castShadow=true; ferris.add(seg);
  const seg2=new THREE.Mesh(new THREE.TorusGeometry(FR*0.65,0.09,6,12,Math.PI/4), mat(0xf1faee,0.6));
  seg2.rotation.z=i*Math.PI/4+0.2; ferris.add(seg2);
}
for(let i=0;i<8;i++){
  const a=i*Math.PI/4;
  const spoke=cyl(0.07,0.07,FR,0xf8f9fa,Math.cos(a)*FR/2,Math.sin(a)*FR/2,0,6);
  spoke.rotation.z=a-Math.PI/2; ferris.add(spoke);
  const cabin=box(1.0,1.0,0.85,rimCols[i],Math.cos(a)*FR,Math.sin(a)*FR,0);
  ferris.add(cabin);
  const cap=box(1.05,0.18,0.9,0xf1faee,Math.cos(a)*FR,Math.sin(a)*FR+0.55,0); ferris.add(cap);
}
const hub=cyl(0.45,0.45,0.8,0xffb703,0,0,0,12); hub.rotation.x=Math.PI/2; ferris.add(hub);
// supports A-frame (world)
function leg(x,z){
  const dx=-3.2-x, dz=-16-z, dy=(DECK+7.2)-DECK;
  const len=Math.hypot(dx,dy,dz);
  const m=cyl(0.18,0.22,len,0xe63946,(x-3.2)/2,DECK+dy/2,(z-16)/2,8);
  m.lookAt(new THREE.Vector3(-3.2,DECK+7.2,-16));
  m.rotateX(Math.PI/2); scene.add(m);
}
leg(-6.5,-19); leg(-6.5,-13); leg(0.5,-19); leg(0.5,-13);

// Roller coaster on side platform
const pts=[
  new THREE.Vector3(5.5,DECK+1.0,6.5),
  new THREE.Vector3(10,DECK+1.0,6.8),
  new THREE.Vector3(14.5,DECK+2.4,5),
  new THREE.Vector3(15,DECK+3.8,1),
  new THREE.Vector3(13,DECK+1.2,-2.5),
  new THREE.Vector3(8,DECK+1.0,-3),
  new THREE.Vector3(5.2,DECK+2.8,-0.5),
  new THREE.Vector3(5.5,DECK+1.0,3)
];
const curve=new THREE.CatmullRomCurve3(pts,true);
const track=new THREE.Mesh(new THREE.TubeGeometry(curve,110,0.14,7,true), mat(0xffd60a,0.45));
track.castShadow=true; scene.add(track);
const track2curve=new THREE.CatmullRomCurve3(pts.map(p=>new THREE.Vector3(p.x,p.y-0.35,p.z)),true);
const track2=new THREE.Mesh(new THREE.TubeGeometry(track2curve,110,0.06,6,true), mat(0x457b9d,0.5));
scene.add(track2);
for(let i=0;i<26;i++){
  const p=curve.getPoint(i/26);
  const h=p.y-(DECK+0.3);
  const s=cyl(0.11,0.13,h,0x1d6fb8,p.x,DECK+0.3+h/2,p.z,7); scene.add(s);
  scene.add(box(0.5,0.15,0.5,0x1d6fb8,p.x,DECK+0.4,p.z));
}
// coaster car
const car=box(1.6,0.6,0.9,0xe63946,10,DECK+1.55,6.8);
scene.add(car);

// palm trees
function palm(x,z,s=1,lean=0.12){
  const g=new THREE.Group(); g.position.set(x,0,z); g.scale.setScalar(s);
  const trunk=cyl(0.14,0.22,4.6,0x8b5a2b,lean*2,2.3,0,9); trunk.rotation.z=lean; g.add(trunk);
  const topY=4.6, topX=lean*4.6;
  for(let i=0;i<8;i++){
    const a=i/8*Math.PI*2;
    const fr=new THREE.Mesh(new THREE.PlaneGeometry(0.65,2.6), new THREE.MeshStandardMaterial({color:0x2a9d4a,side:THREE.DoubleSide,roughness:0.9}));
    fr.position.set(topX+Math.cos(a)*1.0, topY+0.25+Math.sin(i*1.3)*0.15, Math.sin(a)*1.0);
    fr.rotation.set(0.9, a, 0.4, 'YXZ'); fr.castShadow=true; g.add(fr);
  }
  scene.add(g);
}
palm(-12,18,1.1,0.08); palm(10,18.5,1.0,-0.06); palm(15,16.5,0.9,0.14); palm(-8,20,0.85,-0.12); palm(6,20,1.05,0.05); palm(-16,19,0.95,0.1);

// beach umbrellas
for(let i=0;i<6;i++){
  const x=-20+i*7+pseudo(i)*2, z=20+pseudo(i+9)*3;
  scene.add(cyl(0.06,0.06,2.2,0xffffff,x,1.1,z,6));
  const um=new THREE.Mesh(new THREE.ConeGeometry(1.4,0.6,10), mat(rimCols[i%8],0.7));
  um.position.set(x,2.4,z); um.castShadow=true; scene.add(um);
}

// orbit controls
let dragging=false,lastX=0,lastY=0;
renderer.domElement.addEventListener('pointerdown',e=>{dragging=true;lastX=e.clientX;lastY=e.clientY;renderer.domElement.setPointerCapture(e.pointerId);});
renderer.domElement.addEventListener('pointermove',e=>{
  if(!dragging) return;
  theta -= (e.clientX-lastX)*0.006;
  phi -= (e.clientY-lastY)*0.005;
  phi=Math.max(0.25,Math.min(1.45,phi));
  lastX=e.clientX; lastY=e.clientY; render();
});
renderer.domElement.addEventListener('pointerup',()=>{dragging=false;});
renderer.domElement.addEventListener('wheel',e=>{
  e.preventDefault();
  radius=Math.max(24,Math.min(85,radius+e.deltaY*0.04));
  render();
},{passive:false});

window.addEventListener('resize',()=>{
  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.5));
  renderer.setSize(window.innerWidth,window.innerHeight);
  render();
});

render();
</script>
</body>
</html>
