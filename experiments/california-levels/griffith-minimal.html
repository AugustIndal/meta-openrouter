<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Observatory</title>
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#dceaf2;}
  #app{width:100%;height:100%;display:block;touch-action:none;cursor:grab;}
  #app:active{cursor:grabbing;}
</style>
<script type="importmap">
{"imports":{"three":"./three.module.js"}}
</script>
</head>
<body>
<canvas id="app"></canvas>
<script type="module">
import * as THREE from './three.module.js';

const canvas = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xd8e9f2);
scene.fog = new THREE.Fog(0xd8e9f2, 55, 130);

const camera = new THREE.PerspectiveCamera(38, 1200/800, 0.1, 300);
let target = new THREE.Vector3(0, 3.2, 0);
let spherical = new THREE.Spherical(26, 1.08, 0.55);
function updateCamera(){
  camera.position.setFromSpherical(spherical).add(target);
  camera.lookAt(target);
}

// Lighting
const hemi = new THREE.HemisphereLight(0xeaf4ff, 0x7a7a5a, 1.15);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff2d6, 2.6);
sun.position.set(14, 22, 12);
sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left=-22; sun.shadow.camera.right=22; sun.shadow.camera.top=22; sun.shadow.camera.bottom=-22;
sun.shadow.camera.near=1; sun.shadow.camera.far=70; sun.shadow.bias=-0.0004;
scene.add(sun);
const fill = new THREE.DirectionalLight(0xcfe4ff, 0.55);
fill.position.set(-16,10,-8); scene.add(fill);

// Materials
const M = {
  cream: new THREE.MeshStandardMaterial({color:0xf2e8ce, roughness:0.85, metalness:0.02}),
  cream2: new THREE.MeshStandardMaterial({color:0xe8dcc0, roughness:0.9}),
  stone: new THREE.MeshStandardMaterial({color:0xd9cdb2, roughness:0.95}),
  copper: new THREE.MeshStandardMaterial({color:0x4a3a32, roughness:0.45, metalness:0.55}),
  copper2: new THREE.MeshStandardMaterial({color:0x5a4238, roughness:0.4, metalness:0.6}),
  dark: new THREE.MeshStandardMaterial({color:0x2b2b2e, roughness:0.6, metalness:0.2}),
  glass: new THREE.MeshStandardMaterial({color:0x9fc4d6, roughness:0.15, metalness:0.4, emissive:0x223a44, emissiveIntensity:0.25}),
  grass: new THREE.MeshStandardMaterial({color:0x7a8a4a, roughness:1}),
  grassDark: new THREE.MeshStandardMaterial({color:0x5f7038, roughness:1}),
  hill: new THREE.MeshStandardMaterial({color:0x8a7f55, roughness:1}),
  hill2: new THREE.MeshStandardMaterial({color:0x6f7f42, roughness:1}),
  path: new THREE.MeshStandardMaterial({color:0xcabfa3, roughness:1}),
  city: new THREE.MeshStandardMaterial({color:0xb9c2c6, roughness:0.9}),
  city2: new THREE.MeshStandardMaterial({color:0xcac0a8, roughness:0.9}),
  city3: new THREE.MeshStandardMaterial({color:0xa8b3b8, roughness:0.9}),
  tree: new THREE.MeshStandardMaterial({color:0x4a6332, roughness:1}),
  trunk: new THREE.MeshStandardMaterial({color:0x5a4632, roughness:1}),
  white: new THREE.MeshStandardMaterial({color:0xf6f0dc, roughness:0.8})
};

function box(w,h,d,mat,x=0,y=0,z=0,shadow=true){
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
  m.position.set(x,y,z); m.castShadow=shadow; m.receiveShadow=true; return m;
}
function cyl(rt,rb,h,mat,x=0,y=0,z=0,seg=24){
  const m=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg),mat);
  m.position.set(x,y,z); m.castShadow=true; m.receiveShadow=true; return m;
}
function dome(r,mat,x,y,z){
  const g=new THREE.Group();
  const d=new THREE.Mesh(new THREE.SphereGeometry(r,32,18,0,Math.PI*2,0,Math.PI/2),mat);
  d.castShadow=true; d.receiveShadow=true; g.add(d);
  const drum=cyl(r*0.98,r*0.98,r*0.35,mat,0,-r*0.12,0,32); g.add(drum);
  const fin=cyl(r*0.06,r*0.06,r*0.55,M.copper,0,r+ r*0.18,0,10); g.add(fin);
  const tip=new THREE.Mesh(new THREE.SphereGeometry(r*0.12,12,8),M.copper); tip.position.y=r+r*0.48; tip.castShadow=true; g.add(tip);
  g.position.set(x,y,z); return g;
}

// Ground / hill
const ground = new THREE.Mesh(new THREE.CircleGeometry(90,48), new THREE.MeshStandardMaterial({color:0x8fa07a, roughness:1}));
ground.rotation.x=-Math.PI/2; ground.position.y=-2.8; ground.receiveShadow=true; scene.add(ground);

// Hill mound - flattened cone / displaced
const hillGeo = new THREE.CylinderGeometry(17, 34, 5.2, 48, 1);
const hill = new THREE.Mesh(hillGeo, M.hill);
hill.position.y=-0.1; hill.receiveShadow=true; hill.castShadow=true; scene.add(hill);
// Green top cap
const cap = new THREE.Mesh(new THREE.CylinderGeometry(17.15,17.15,0.35,48), M.hill2);
cap.position.y=2.45; cap.receiveShadow=true; scene.add(cap);
// Front lawn plateau
const lawn = box(34,0.3,22,M.grass,0,2.6,1); scene.add(lawn);

// Side slopes details - rocks / shrubs
for(let i=0;i<28;i++){
  const a=(i/28)*Math.PI*2+0.3;
  const r=20+ (i%3)*4;
  const s=box(1.2+(i%3)*0.5,0.6,1.0,M.grassDark,Math.cos(a)*r, -0.5+ (i%2)*0.3, Math.sin(a)*r-6);
  s.rotation.y=a; scene.add(s);
}

// City below - in front / behind low boxes on lower plane
const cityGroup=new THREE.Group();
let seed=7; function rnd(){seed=(seed*16807)%2147483647; return seed/2147483647;}
for(let i=0;i<90;i++){
  const x=-42+rnd()*84, z=-38+rnd()*18; // behind hill (negative z beyond)
  if(Math.abs(x)<15 && z>-22) continue;
  const h=1+rnd()*3.2;
  const b=box(1.5+rnd()*2.2,h,1.5+rnd()*2, rnd()>0.5?M.city:M.city2, x, -2.8+h/2, z);
  cityGroup.add(b);
}
for(let i=0;i<50;i++){
  const x=-45+rnd()*90, z=18+rnd()*22;
  const h=0.8+rnd()*2.4;
  const b=box(1.4+rnd()*2,h,1.4+rnd()*2, rnd()>0.5?M.city3:M.city, x, -2.8+h/2, z);
  cityGroup.add(b);
}
scene.add(cityGroup);

// Observatory group
const obs=new THREE.Group(); obs.position.set(0,2.75,0); scene.add(obs);

// Main central block
obs.add(box(10,4.2,6.5,M.cream,0,2.1,-1));
obs.add(box(10.6,0.5,7.1,M.cream2,0,4.35,-1)); // cornice
obs.add(box(10,0.4,6.5,M.stone,0,0.2,-1)); // plinth
// Wings left/right lower
obs.add(box(5.5,2.8,5,M.cream,-7.6,1.4,-0.8));
obs.add(box(5.5,2.8,5,M.cream,7.6,1.4,-0.8));
obs.add(box(6,0.4,5.5,M.cream2,-7.6,2.95,-0.8));
obs.add(box(6,0.4,5.5,M.cream2,7.6,2.95,-0.8));
// Connector wings inner
obs.add(box(3,2.4,4.6,M.cream,-4.8,1.2,-0.7));
obs.add(box(3,2.4,4.6,M.cream,4.8,1.2,-0.7));

// Domes
obs.add(dome(3.2,M.copper,0,4.6,-1));
obs.add(dome(1.9,M.copper2,-7.6,3.15,-0.8));
obs.add(dome(1.9,M.copper2,7.6,3.15,-0.8));

// Windows - dark slits / arched
function windowPane(x,y,z,w=0.7,h=1.4){
  const p=box(w,h,0.08,M.dark,x,y,z,false); obs.add(p);
  const top=cyl(w/2,w/2,0.08,M.dark,x,y+h/2,z,12); top.rotation.x=Math.PI/2; obs.add(top);
}
for(let x of [-3.6,-1.2,1.2,3.6]) windowPane(x,2.2,2.26);
for(let x of [-8.8,-6.4,6.4,8.8]) windowPane(x,1.5,1.71,0.55,0.9);
// Central door
obs.add(box(1.6,2.4,0.12,M.dark,0,1.3,2.26,false));
obs.add(box(2.0,0.25,0.2,M.copper,0,2.65,2.3,false));

// Terrace front
obs.add(box(20,0.45,4.2,M.stone,0,0.22,4.2));
obs.add(box(20.4,0.25,4.6,M.cream2,0,0.55,4.2));
// Balustrade
function balustrade(z,y,len,x0){
  obs.add(box(len,0.18,0.22,M.white,x0,y+0.55,z,false));
  for(let i=0;i<=Math.floor(len/0.65);i++){
    const x=x0-len/2+i*0.65;
    obs.add(box(0.14,0.55,0.14,M.white,x,y+0.27,z,false));
  }
}
balustrade(6.15,0.65,20,0);
// side balustrades
for(let s of [-1,1]){
  for(let i=0;i<6;i++) obs.add(box(0.14,0.55,0.14,M.white,s*10,0.92,2.2+i*0.65,false));
  obs.add(box(0.22,0.18,4.2,M.white,s*10,1.2,4.2,false));
}

// Wide steps
for(let i=0;i<5;i++){
  obs.add(box(8-i*0.4,0.28,0.9,M.stone,0,0.15+i*0.02,7.2+i*0.55));
}

// Low geometric walls on lawn
obs.add(box(0.4,0.9,10,M.cream2,-11,0.45,6));
obs.add(box(0.4,0.9,10,M.cream2,11,0.45,6));
obs.add(box(22.4,0.9,0.4,M.cream2,0,0.45,11));
obs.add(box(0.35,0.65,6,M.cream2,-6,0.32,9));
obs.add(box(0.35,0.65,6,M.cream2,6,0.32,9));

// Path
const path=box(3.2,0.12,8,M.path,0,0.07,11, false); scene.add(path); path.position.y=2.82; // on lawn
// Obelisk monument on front lawn (to right of path)
const obGroup=new THREE.Group(); obGroup.position.set(5.2,2.75,9); scene.add(obGroup);
obGroup.add(box(1.4,0.3,1.4,M.stone,0,0.15,0));
obGroup.add(box(0.9,0.25,0.9,M.cream2,0,0.4,0));
const ob=cyl(0.18,0.42,2.2,M.white,0,1.5,0,4); ob.rotation.y=Math.PI/4; obGroup.add(ob);
const pyr=new THREE.Mesh(new THREE.ConeGeometry(0.32,0.6,4),M.copper); pyr.position.y=2.9; pyr.rotation.y=Math.PI/4; pyr.castShadow=true; obGroup.add(pyr);
// small plaque base
obGroup.add(box(0.7,0.5,0.08,M.dark,0,0.75,0.46,false));

// Trees / shrubs symmetrical
function tree(x,z,s=1){
  const g=new THREE.Group(); g.position.set(x,2.75,z); g.scale.setScalar(s);
  g.add(cyl(0.14,0.2,1.0,M.trunk,0,0.5,0,8));
  const c1=new THREE.Mesh(new THREE.SphereGeometry(0.85,14,10),M.tree); c1.position.y=1.4; c1.castShadow=true; g.add(c1);
  const c2=new THREE.Mesh(new THREE.SphereGeometry(0.55,12,8),M.tree); c2.position.set(0.45,1.0,0.2); c2.castShadow=true; g.add(c2);
  scene.add(g);
}
tree(-13,4,1.1); tree(13,4,1.1); tree(-9.5,10,0.9); tree(9.5,10,0.9); tree(-14,-2,1); tree(14,-2,1); tree(-5,12,0.7); tree(5,12,0.7);
// Bushes near building
for(let x of [-9,-3,3,9]){ const b=new THREE.Mesh(new THREE.SphereGeometry(0.55,10,8),M.tree); b.position.set(x,3.1,3.5); b.castShadow=true; scene.add(b); }

// Orbit controls native
let dragging=false, px=0, py=0;
canvas.addEventListener('pointerdown',e=>{dragging=true; px=e.clientX; py=e.clientY; canvas.setPointerCapture(e.pointerId);});
canvas.addEventListener('pointermove',e=>{
  if(!dragging) return;
  const dx=e.clientX-px, dy=e.clientY-py; px=e.clientX; py=e.clientY;
  spherical.theta -= dx*0.005;
  spherical.phi = THREE.MathUtils.clamp(spherical.phi - dy*0.005, 0.55, 1.45);
  updateCamera(); render();
});
canvas.addEventListener('pointerup',()=>dragging=false);
canvas.addEventListener('pointercancel',()=>dragging=false);
canvas.addEventListener('wheel',e=>{
  e.preventDefault();
  spherical.radius = THREE.MathUtils.clamp(spherical.radius + e.deltaY*0.02, 14, 42);
  updateCamera(); render();
},{passive:false});

function resize(){
  const w=window.innerWidth, h=window.innerHeight;
  renderer.setSize(w,h,false);
  camera.aspect=w/h; camera.updateProjectionMatrix();
  render();
}
function render(){ renderer.render(scene,camera); }

window.addEventListener('resize',resize);
resize();
// sceneReady after first frame
requestAnimationFrame(()=>{ render(); window.sceneReady=true; });
</script>
</body>
</html>
