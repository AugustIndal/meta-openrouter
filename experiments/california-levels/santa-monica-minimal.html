<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pier Scene</title>
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#8ecfe8;}
  canvas{display:block;width:100%;height:100%;}
</style>
<script type="importmap">{"imports":{"three":"./three.module.js"}}</script>
</head>
<body>
<script type="module">
import * as THREE from './three.module.js';

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(1200,800);
renderer.setPixelRatio(Math.min(window.devicePixelRatio,1.5));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x8ecfe8);

const camera = new THREE.PerspectiveCamera(42, 1200/800, 0.1, 500);

// Orbit state
let theta = 0.62, phi = 1.08, radius = 58;
const target = new THREE.Vector3(0,4,-6);
function updateCamera(){
  phi = Math.max(0.35, Math.min(1.45, phi));
  radius = Math.max(22, Math.min(95, radius));
  camera.position.set(
    target.x + radius*Math.sin(phi)*Math.sin(theta),
    target.y + radius*Math.cos(phi),
    target.z + radius*Math.sin(phi)*Math.cos(theta)
  );
  camera.lookAt(target);
}
updateCamera();

// Lights
scene.add(new THREE.HemisphereLight(0xcfefff, 0xe8d8a8, 0.95));
const sun = new THREE.DirectionalLight(0xfff2d0, 2.2);
sun.position.set(28,42,18);
sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left=-45; sun.shadow.camera.right=45;
sun.shadow.camera.top=40; sun.shadow.camera.bottom=-40;
sun.shadow.camera.far=120;
scene.add(sun);
const fill = new THREE.DirectionalLight(0x9fd8ff, 0.5);
fill.position.set(-25,18,-20);
scene.add(fill);

// Materials helper
function mat(color, rough=0.85, metal=0){
  return new THREE.MeshStandardMaterial({color, roughness:rough, metalness:metal});
}
function box(w,h,d,color,x,y,z,parent=scene,rough=0.85){
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat(color,rough));
  m.position.set(x,y,z); m.castShadow=true; m.receiveShadow=true; parent.add(m); return m;
}
function cyl(rt,rb,h,color,x,y,z,parent=scene,seg=12){
  const m=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg), mat(color,0.8));
  m.position.set(x,y,z); m.castShadow=true; m.receiveShadow=true; parent.add(m); return m;
}
function sph(r,color,x,y,z,parent=scene){
  const m=new THREE.Mesh(new THREE.SphereGeometry(r,14,12), mat(color,0.7));
  m.position.set(x,y,z); m.castShadow=true; m.receiveShadow=true; parent.add(m); return m;
}

// Sky dome gradient via large sphere shader-free: background color is enough, add sun disc
sph(2.2,0xfff6c8,32,38,-55).material = new THREE.MeshBasicMaterial({color:0xfff6c8});

// Beach sand
const sand = new THREE.Mesh(new THREE.PlaneGeometry(110,38), mat(0xeed9a0,1));
sand.rotation.x = -Math.PI/2; sand.position.set(0,0,14); sand.receiveShadow=true; scene.add(sand);
// Ocean
const ocean = new THREE.Mesh(new THREE.PlaneGeometry(110,70), mat(0x1a7fbf,0.35,0.1));
ocean.rotation.x = -Math.PI/2; ocean.position.set(0,-0.55,-22); ocean.receiveShadow=true; scene.add(ocean);
// Ocean surface detail stripes deterministic
for(let i=0;i<28;i++){
  const z = -48 + i*1.7 + (i%3)*0.3;
  const w = 18 + (i*7)%22;
  const stripe = box(w,0.06,0.45, 0x7fd4f0, ((i*13)%30)-15, -0.48, z, scene, 0.4);
  stripe.castShadow=false;
}
// Foamy waves near shore and piles
for(let i=0;i<22;i++){
  const x=-42+i*3.9;
  const z=-3.5+Math.sin(i*1.7)*0.7;
  const f=new THREE.Mesh(new THREE.SphereGeometry(1.1,10,8), mat(0xffffff,0.9));
  f.scale.set(1.6,0.28,0.7); f.position.set(x,-0.35,z); f.receiveShadow=true; scene.add(f);
}

// Pier deck extending into ocean (z negative)
const deck = box(10,0.7,44, 0x9a6b3f, 0,2.2,-12);
box(10.6,0.25,44, 0xb98852, 0,2.65,-12);
// Planks lines
for(let i=0;i<22;i++){
  box(10.2,0.06,0.12, 0x7d552f, 0,2.79,-32+i*2, scene,0.9).castShadow=false;
}
// Timber piles
for(let ix=-4.6; ix<=4.6; ix+=2.3){
  for(let iz=-32; iz<=-1; iz+=4.2){
    cyl(0.28,0.32,5.2, 0x6b4a2b, ix,0.2,iz, scene,8);
  }
}
// Railings along pier
for(const side of [-5,5]){
  box(0.18,0.12,42, 0x8a5f36, side,3.55,-12);
  box(0.14,0.08,42, 0x8a5f36, side,2.95,-12);
  for(let iz=-32; iz<=-1; iz+=3.5){
    box(0.16,1.0,0.16, 0x7d552f, side,3.05,iz);
  }
}
// Pier end platform wider
box(15,0.7,10, 0x9a6b3f, 0,2.2,-35);
for(const side of [-7.5,7.5]) box(0.18,0.12,10, 0x8a5f36, side,3.55,-35);

// Low buildings near shore
function building(x,z,w,d,h,color,roofColor){
  box(w,h,d,color,x,1.2+h/2,z);
  // roof prism-like: box rotated 45? use cone 4-sided scaled
  const roof=new THREE.Mesh(new THREE.ConeGeometry(Math.max(w,d)*0.72,1.6,4), mat(roofColor,0.8));
  roof.position.set(x,1.2+h+0.8,z); roof.rotation.y=Math.PI/4; roof.scale.set(w/Math.max(w,d),1,d/Math.max(w,d));
  roof.castShadow=true; roof.receiveShadow=true; scene.add(roof);
  // windows
  for(let i=0;i<3;i++) box(0.9,0.9,0.08,0x2e5a7a, x-w/3+i*w/3, 1.7, z+d/2+0.05);
}
building(-14,6,7,5,2.6,0xffe8d6,0xd95f4b);
building(-6,7,6,5,2.2,0xdff2ff,0x3a8fb7);
building(10,6,7,5,2.8,0xfff1c2,0xe76f51);
building(17,7,5,4,2.0,0xe6ffe8,0x2a9d8f);
box(4,2.2,0.4,0x8a5f36,-10,2.3,3.2); // entrance kiosk

// Palm trees
function palm(x,z,s=1){
  const g=new THREE.Group(); g.position.set(x,0,z); g.scale.setScalar(s); scene.add(g);
  const trunk=cyl(0.22,0.34,4.2,0x8a6a45,0,2.1,0,g,8);
  trunk.rotation.z = 0.12;
  for(let i=0;i<7;i++){
    const leaf=new THREE.Mesh(new THREE.ConeGeometry(0.45,3.2,5), mat(0x2ea85c,0.8));
    leaf.position.set(Math.cos(i*0.9)*1.3,4.4,Math.sin(i*0.9)*1.3);
    leaf.rotation.z = Math.cos(i*0.9)*0.9;
    leaf.rotation.x = -Math.sin(i*0.9)*0.9;
    leaf.castShadow=true; g.add(leaf);
  }
  sph(0.35,0x6b4a2b,0.4,4.0,0.2,g); sph(0.35,0x6b4a2b,-0.3,4.0,-0.2,g);
}
palm(-20,9,1.1); palm(-4,11,0.9); palm(14,10,1.2); palm(22,9,0.95); palm(-24,1,0.85); palm(24,2,1.0);

// Ferris wheel
const ferris = new THREE.Group(); ferris.position.set(-7,2.6,-34); scene.add(ferris);
cyl(0.35,0.45,11,0xd94f4f,-2.5,5.5,0,ferris,10).rotation.z=0.25;
cyl(0.35,0.45,11,0xd94f4f,2.5,5.5,0,ferris,10).rotation.z=-0.25;
const wheel = new THREE.Group(); wheel.position.set(0,11,0); ferris.add(wheel);
const rim=new THREE.Mesh(new THREE.TorusGeometry(8.5,0.32,10,48), mat(0xff5a5a,0.5,0.2));
rim.castShadow=true; wheel.add(rim);
const rim2=rim.clone(); rim2.scale.setScalar(0.72); wheel.add(rim2);
for(let i=0;i<8;i++){
  const a=i*Math.PI/4;
  const spoke=cyl(0.12,0.12,17,0xffd166,0,0,0,wheel,8);
  spoke.rotation.z=a;
  const cabin=box(1.5,1.3,1.3, [0xffd166,0x4cc9f0,0xff8fa3,0x80ed99][i%4], Math.cos(a)*8.5, Math.sin(a)*8.5,0,wheel);
  cabin.rotation.z = -a*0.1;
}
sph(0.7,0xffffff,0,0,0,wheel);

// Roller coaster - yellow track, blue supports
const coaster = new THREE.Group(); coaster.position.set(9,2.6,-32); scene.add(coaster);
const points=[];
for(let i=0;i<=20;i++){
  const t=i/20, x=-11+t*22;
  const y=2 + Math.abs(Math.sin(t*Math.PI*2.2))*5 + Math.sin(t*Math.PI)*2;
  const z=Math.sin(t*Math.PI*3)*3;
  points.push(new THREE.Vector3(x,y,z));
}
const curve=new THREE.CatmullRomCurve3(points);
const track=new THREE.Mesh(new THREE.TubeGeometry(curve,80,0.28,8,false), mat(0xffd400,0.45,0.15));
track.castShadow=true; track.receiveShadow=true; coaster.add(track);
// second rail offset via another tube slightly lower - keep simple: cross ties
for(let i=0;i<=16;i++){
  const p=curve.getPoint(i/16);
  const tie=box(1.6,0.12,0.12,0x333333,p.x,p.y-0.3,p.z,coaster); tie.rotation.y = -Math.sin(i)*0.3;
  if(i%2===0) cyl(0.18,0.22,p.y,0x2255cc,p.x,p.y/2,p.z,coaster,8);
}
// support bents
for(let i=0;i<=8;i++){
  const p=curve.getPoint(i/8);
  cyl(0.2,0.24,p.y,0x2255cc,p.x-0.8,p.y/2,p.z,coaster,8);
  cyl(0.2,0.24,p.y,0x2255cc,p.x+0.8,p.y/2,p.z,coaster,8);
  box(2.2,0.2,0.2,0x2255cc,p.x,p.y-0.1,p.z,coaster);
}
// coaster car
const carP=curve.getPoint(0.55);
box(2.6,0.9,1.6,0xe63946,carP.x,carP.y+0.6,carP.z,coaster);

// Small details: benches, lamp posts, flags
for(let i=0;i<5;i++){
  box(2,0.15,0.6,0x8a5f36,-3.5,2.9,-5-i*5);
  cyl(0.08,0.08,1.8,0x333333,-4.4,3.6,-6-i*5,scene,6);
  sph(0.28,0xfff6c8,-4.4,4.6,-6-i*5);
}
for(let i=0;i<6;i++){
  const pole=cyl(0.06,0.06,3,0xeeeeee,-4.8,4.2,-28+i*1.2,scene,6);
  const flag=box(0.9,0.5,0.04,[0xff5a5a,0xffd166,0x4cc9f0,0x80ed99,0xff8fa3,0xffffff][i],-4.3,5.4,-28+i*1.2);
}

// Resize
function onResize(){
  const w=window.innerWidth, h=window.innerHeight;
  camera.aspect=w/h; camera.updateProjectionMatrix();
  renderer.setSize(w,h);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,1.5));
  renderer.render(scene,camera);
}
window.addEventListener('resize',onResize);

// Native pointer drag orbit + wheel zoom
let dragging=false,lastX=0,lastY=0;
renderer.domElement.addEventListener('pointerdown',e=>{dragging=true;lastX=e.clientX;lastY=e.clientY;renderer.domElement.setPointerCapture(e.pointerId);});
renderer.domElement.addEventListener('pointermove',e=>{
  if(!dragging) return;
  theta -= (e.clientX-lastX)*0.008;
  phi -= (e.clientY-lastY)*0.006;
  lastX=e.clientX; lastY=e.clientY;
  updateCamera(); renderer.render(scene,camera);
});
renderer.domElement.addEventListener('pointerup',()=>dragging=false);
renderer.domElement.addEventListener('wheel',e=>{
  e.preventDefault();
  radius += e.deltaY*0.05;
  updateCamera(); renderer.render(scene,camera);
},{passive:false});

// Touch pinch basic
let lastDist=0;
renderer.domElement.addEventListener('touchmove',e=>{
  if(e.touches.length===2){
    const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
    if(lastDist) radius += (lastDist-d)*0.15;
    lastDist=d; updateCamera(); renderer.render(scene,camera);
  }
},{passive:true});
renderer.domElement.addEventListener('touchend',()=>lastDist=0);

// Initial render
renderer.render(scene,camera);
window.sceneReady = true;
</script>
</body>
</html>
