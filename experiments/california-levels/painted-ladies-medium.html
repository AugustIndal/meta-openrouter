<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pastel Victorian Row</title>
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#bcd7e8}
  canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
  canvas:active{cursor:grabbing}
</style>
<script type="importmap">
{"imports":{"three":"./three.module.js"}}
</script>
</head>
<body>
<script type="module">
import * as THREE from './three.module.js';

const renderer = new THREE.WebGLRenderer({antialias:true, powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xbcd7e8);

const camera = new THREE.PerspectiveCamera(40, window.innerWidth/window.innerHeight, 0.1, 300);
const target = new THREE.Vector3(0, 4.2, 0);
let theta = 0, phi = 1.33, radius = 47;
function updateCamera(){
  phi = Math.max(0.85, Math.min(1.52, phi));
  theta = Math.max(-0.75, Math.min(0.75, theta));
  radius = Math.max(24, Math.min(68, radius));
  camera.position.set(
    target.x + radius*Math.sin(phi)*Math.sin(theta),
    target.y + radius*Math.cos(phi),
    target.z + radius*Math.sin(phi)*Math.cos(theta)
  );
  camera.lookAt(target);
}
updateCamera();

const hemi = new THREE.HemisphereLight(0xd8ecff, 0x7aa85e, 0.95);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff2d8, 2.1);
sun.position.set(18, 26, 16);
sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left = -38; sun.shadow.camera.right = 38;
sun.shadow.camera.top = 32; sun.shadow.camera.bottom = -22;
sun.shadow.camera.near = 2; sun.shadow.camera.far = 80;
sun.shadow.bias = -0.0004;
scene.add(sun);
const fill = new THREE.DirectionalLight(0xcfe4ff, 0.45);
fill.position.set(-16, 12, 20);
scene.add(fill);

// ---------- helpers ----------
const whiteMat = new THREE.MeshStandardMaterial({color:0xffffff, roughness:0.55, metalness:0.02});
const glassMat = new THREE.MeshStandardMaterial({color:0x33505e, roughness:0.18, metalness:0.35});
const glassLightMat = new THREE.MeshStandardMaterial({color:0x9fc6d6, roughness:0.12, metalness:0.25});
const darkWoodMat = new THREE.MeshStandardMaterial({color:0x4a3428, roughness:0.7});
const brickMat = new THREE.MeshStandardMaterial({color:0x9a5f4a, roughness:0.85});
const grassMat = new THREE.MeshStandardMaterial({color:0x7ab35c, roughness:0.95});
const pathMat = new THREE.MeshStandardMaterial({color:0xd9d5c8, roughness:0.9});
const trunkMat = new THREE.MeshStandardMaterial({color:0x6b4a32, roughness:0.9});
const leafMats = [0x5da24e,0x6cb35c,0x4f9142].map(c=>new THREE.MeshStandardMaterial({color:c, roughness:0.9}));

function box(w,h,d,mat,x=0,y=0,z=0,shadow=true){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat);
  m.position.set(x,y,z);
  m.castShadow = shadow; m.receiveShadow = true;
  return m;
}
function groundY(x,z){
  const base = -x*0.09;
  let drop = 0, und = 0;
  if(z > 3){
    drop = (z-3)*0.21;
    const k = Math.min(1,(z-3)/5);
    und = Math.sin(x*0.34+1.2)*0.28*k + Math.cos(z*0.45+x*0.18)*0.16*k;
  }
  if(z < -8) drop = (z+8)*0.06;
  return base - drop + und;
}
function gableGeometry(w,h,d){
  const hw=w/2, hd=d/2;
  const LF=-hw, RF=hw;
  const pos = [
    // left slope
    LF,0,hd,  LF,0,-hd,  0,h,-hd,   LF,0,hd,  0,h,-hd,  0,h,hd,
    // right slope
    0,h,hd,  RF,0,hd,  RF,0,-hd,   0,h,hd,  RF,0,-hd,  0,h,-hd,
    // front triangle
    LF,0,hd,  RF,0,hd,  0,h,hd,
    // back triangle
    LF,0,-hd,  0,h,-hd,  RF,0,-hd
  ];
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
  g.computeVertexNormals();
  return g;
}
function makeWindow(w,h,mat=glassMat){
  const g = new THREE.Group();
  g.add(box(w+0.22,h+0.22,0.09,whiteMat,0,0,0));
  g.add(box(w,h,0.11,mat,0,0,0.015));
  g.add(box(0.055,h,0.04,whiteMat,0,0,0.07,false));
  g.add(box(w,0.055,0.04,whiteMat,0,0,0.07,false));
  g.add(box(w+0.34,0.12,0.18,whiteMat,0,h/2+0.14,0.02,false));
  return g;
}
function makeTree(s, leafMat){
  const g = new THREE.Group();
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.14*s,0.2*s,1.6*s,7), trunkMat);
  trunk.position.y = 0.8*s; trunk.castShadow = true; g.add(trunk);
  const geo = new THREE.IcosahedronGeometry(1.05*s,1);
  const a = new THREE.Mesh(geo, leafMat); a.position.y = 2.2*s; a.castShadow=true; g.add(a);
  const b = new THREE.Mesh(geo, leafMat); b.scale.set(0.72,0.72,0.72); b.position.set(0.55*s,2.85*s,0.25*s); b.castShadow=true; g.add(b);
  const c = new THREE.Mesh(geo, leafMat); c.scale.set(0.62,0.62,0.62); c.position.set(-0.5*s,2.7*s,-0.2*s); c.castShadow=true; g.add(c);
  return g;
}

// ---------- terrain / hillside ----------
const terrGeo = new THREE.PlaneGeometry(98,58,52,30);
terrGeo.rotateX(-Math.PI/2);
{
  const p = terrGeo.attributes.position;
  for(let i=0;i<p.count;i++){
    const x = p.getX(i), z = p.getZ(i)+2;
    p.setY(i, groundY(x,z));
  }
  terrGeo.computeVertexNormals();
}
const terrain = new THREE.Mesh(terrGeo, grassMat);
terrain.position.z = 2;
terrain.receiveShadow = true;
scene.add(terrain);

// sloping front path
const path = box(52,0.12,2.4,pathMat,0,0,3.4,false);
path.rotation.z = Math.atan(-0.09);
path.position.y = groundY(0,3.4)+0.06;
path.receiveShadow = true;
scene.add(path);

// ---------- distant high-rises ----------
const highGroup = new THREE.Group();
scene.add(highGroup);
const bDefs = [
  {x:-22,z:-24,w:7,h:26,d:7,c:0xc9d2d8},
  {x:-14,z:-20,w:6,h:17,d:6,c:0xb8c6d2},
  {x:-6,z:-26,w:8,h:30,d:7,c:0xd3cfc2},
  {x:2,z:-21,w:6,h:20,d:6,c:0xc2ccd4},
  {x:10,z:-26,w:7,h:27,d:7,c:0xb6c2c9},
  {x:18,z:-21,w:6,h:16,d:6,c:0xd0c9bd},
  {x:25,z:-25,w:6,h:22,d:6,c:0xc4cfd8},
  {x:-18,z:-31,w:9,h:20,d:7,c:0xd8d2c4},
  {x:6,z:-32,w:8,h:18,d:7,c:0xbbc8d1},
  {x:-1,z:-38,w:10,h:34,d:8,c:0xcdd6dd}
];
const winMats = [];
const winGeo = new THREE.BoxGeometry(0.55,0.75,0.06);
const winMat = new THREE.MeshStandardMaterial({color:0xeaf2f5, roughness:0.3, metalness:0.15, emissive:0x33444a, emissiveIntensity:0.25});
let totalWins = 0;
bDefs.forEach(b=>{ totalWins += Math.floor((b.w-0.8)/0.95)*Math.floor((b.h-1.2)/1.15); });
const winInst = new THREE.InstancedMesh(winGeo, winMat, totalWins);
{
  const dummy = new THREE.Object3D();
  let idx = 0;
  bDefs.forEach(b=>{
    const baseY = groundY(b.x,b.z);
    const mesh = box(b.w,b.h,b.d,new THREE.MeshStandardMaterial({color:b.c, roughness:0.75}), b.x, baseY+b.h/2, b.z);
    highGroup.add(mesh);
    highGroup.add(box(b.w+0.4,0.35,b.d+0.4,whiteMat,b.x,baseY+b.h+0.15,b.z,false));
    for(let ix=0; ix<Math.floor((b.w-0.8)/0.95); ix++){
      for(let iy=0; iy<Math.floor((b.h-1.2)/1.15); iy++){
        dummy.position.set(b.x - (Math.floor((b.w-0.8)/0.95)-1)*0.475 + ix*0.95, baseY+0.9+iy*1.15, b.z+b.d/2+0.04);
        dummy.rotation.set(0,0,0); dummy.updateMatrix();
        if(idx<totalWins) winInst.setMatrixAt(idx++, dummy.matrix);
      }
    }
  });
  winInst.count = idx;
  highGroup.add(winInst);
}

// clouds
const cloudMat = new THREE.MeshStandardMaterial({color:0xffffff, roughness:1});
function cloud(x,y,z,s){
  const g=new THREE.Group();
  const geo=new THREE.SphereGeometry(1,10,8);
  [[0,0,0,1.6],[1.4,0.2,0,1.1],[-1.4,0.1,0,1.05],[0.5,0.45,0.3,0.95]].forEach(p=>{
    const m=new THREE.Mesh(geo,cloudMat); m.position.set(p[0]*s,p[1]*s,p[2]*s); m.scale.set(p[3]*s,p[3]*0.55*s,p[3]*s); g.add(m);
  });
  g.position.set(x,y,z); scene.add(g);
}
cloud(-20,24,-30,2.4); cloud(8,27,-36,3); cloud(22,23,-28,2); cloud(-4,29,-42,2.6);

// ---------- houses ----------
const pastel = [0xf3c6bd,0xf9e3a5,0xbcd8e8,0xcfe8bd,0xe6d3ef,0xfbd0a3,0xf6b9b0];
const roofs  = [0x5d6b78,0x7a4a4a,0x516a72,0x6b5a6e,0x4e6b5e,0x71584a,0x5a5f7a];
const heights = [7.0,6.6,7.4,6.8,7.2,6.5,7.1];

function makeHouse(i){
  const x = -18 + i*6;
  const baseY = groundY(x,0);
  const col = pastel[i], roofCol = roofs[i], H = heights[i];
  const W = 5.1, D = 4.6;
  const g = new THREE.Group();
  g.position.set(x, baseY, 0);

  // stepped terrace
  g.add(box(W+0.7,0.55,D+2.0,pathMat,0,0.02,0.4));
  const bodyMat = new THREE.MeshStandardMaterial({color:col, roughness:0.8});
  const roofMat = new THREE.MeshStandardMaterial({color:roofCol, roughness:0.65, side:THREE.DoubleSide});
  const body = box(W,H,D,bodyMat,0,0.3+H/2,0);
  g.add(body);

  // white corner boards and cornice
  [[-W/2,-D/2],[W/2,-D/2],[-W/2,D/2],[W/2,D/2]].forEach(p=>{
    g.add(box(0.22,H,0.22,whiteMat,p[0],0.3+H/2,p[1],false));
  });
  g.add(box(W+0.55,0.28,D+0.55,whiteMat,0,0.3+H+0.1,0));
  g.add(box(W+0.35,0.18,D+0.35,whiteMat,0,0.3+H-0.18,0,false));
  // decorative brackets under cornice
  for(let b=0;b<7;b++){
    const bx = -W/2+0.5 + b*(W-1)/6;
    g.add(box(0.14,0.34,0.14,whiteMat,bx,0.3+H-0.42,D/2+0.18,false));
    g.add(box(0.14,0.34,0.14,whiteMat,bx,0.3+H-0.42,-D/2-0.18,false));
  }

  // steep gabled roof
  const roof = new THREE.Mesh(gableGeometry(W+0.65,2.5,D+0.65), roofMat);
  roof.position.y = 0.3+H+0.22; roof.castShadow=true; roof.receiveShadow=true;
  g.add(roof);
  // ridge finial
  const fin = new THREE.Mesh(new THREE.ConeGeometry(0.16,0.65,8), whiteMat);
  fin.position.set(0,0.3+H+0.22+2.5+0.3,D/2+0.28); fin.castShadow=true; g.add(fin);
  const finBall = new THREE.Mesh(new THREE.SphereGeometry(0.13,8,6), whiteMat);
  finBall.position.set(0,0.3+H+0.22+2.5+0.68,D/2+0.28); g.add(finBall);
  // chimney
  g.add(box(0.65,1.6,0.65,brickMat, W*0.28, 0.3+H+2.15, -0.8));
  g.add(box(0.85,0.2,0.85,whiteMat, W*0.28, 0.3+H+2.98, -0.8,false));

  // gable round window
  const roundFrame = new THREE.Mesh(new THREE.CylinderGeometry(0.42,0.42,0.1,16), whiteMat);
  roundFrame.rotation.x = Math.PI/2; roundFrame.position.set(0,0.3+H+0.95,D/2+0.22); g.add(roundFrame);
  const roundGlass = new THREE.Mesh(new THREE.CylinderGeometry(0.32,0.32,0.12,16), glassMat);
  roundGlass.rotation.x = Math.PI/2; roundGlass.position.set(0,0.3+H+0.95,D/2+0.23); g.add(roundGlass);

  // bay window (alternating side)
  const baySide = (i%2===0)? -1 : 1;
  const bayX = baySide*1.15;
  const bay = box(2.3,3.7,0.95,bodyMat,bayX,0.3+1.85,D/2+0.42);
  g.add(bay);
  g.add(box(2.55,0.22,1.15,whiteMat,bayX,0.3+3.82,D/2+0.42));
  const bayRoof = new THREE.Mesh(gableGeometry(2.55,0.85,1.2), roofMat);
  bayRoof.position.set(bayX,0.3+3.92,D/2+0.42); bayRoof.castShadow=true; g.add(bayRoof);
  // bay windows front + sides
  const bw1 = makeWindow(1.35,2.2); bw1.position.set(bayX,0.3+1.95,D/2+0.92); g.add(bw1);
  const bwS1 = makeWindow(0.65,2.0,glassLightMat); bwS1.rotation.y = Math.PI/2; bwS1.position.set(bayX-1.16,0.3+1.95,D/2+0.42); g.add(bwS1);
  const bwS2 = makeWindow(0.65,2.0,glassLightMat); bwS2.rotation.y = -Math.PI/2; bwS2.position.set(bayX+1.16,0.3+1.95,D/2+0.42); g.add(bwS2);

  // upper floor windows
  const upY = 0.3+H-1.55;
  const w1 = makeWindow(0.95,1.55); w1.position.set(-1.35,upY,D/2+0.06); g.add(w1);
  const w2 = makeWindow(0.95,1.55); w2.position.set(1.35,upY,D/2+0.06); g.add(w2);
  const w3 = makeWindow(0.8,1.3); w3.position.set(0,0.3+3.95,D/2+0.06); g.add(w3);
  // side windows for depth
  const sw = makeWindow(0.8,1.4); sw.rotation.y = Math.PI/2; sw.position.set(W/2+0.06,upY,0); g.add(sw);
  const sw2 = makeWindow(0.8,1.4); sw2.rotation.y = -Math.PI/2; sw2.position.set(-W/2-0.06,upY,0); g.add(sw2);

  // door opposite bay
  const doorX = -baySide*1.65;
  g.add(box(1.05,2.35,0.14,whiteMat,doorX,0.3+1.18,D/2+0.06,false));
  g.add(box(0.88,2.18,0.16,darkWoodMat,doorX,0.3+1.1,D/2+0.08,false));
  const knob = new THREE.Mesh(new THREE.SphereGeometry(0.07,8,6), new THREE.MeshStandardMaterial({color:0xd9b84a, roughness:0.3, metalness:0.6}));
  knob.position.set(doorX+0.32,0.3+1.1,D/2+0.2); g.add(knob);
  // porch roof over door
  const porchRoof = new THREE.Mesh(gableGeometry(1.7,0.55,1.0), roofMat);
  porchRoof.position.set(doorX,0.3+2.65,D/2+0.35); porchRoof.castShadow=true; g.add(porchRoof);
  g.add(box(0.12,2.3,0.12,whiteMat,doorX-0.75,0.3+1.15,D/2+0.68,false));
  g.add(box(0.12,2.3,0.12,whiteMat,doorX+0.75,0.3+1.15,D/2+0.68,false));
  // steps
  g.add(box(1.5,0.22,0.5,pathMat,doorX,0.38,D/2+1.35));
  g.add(box(1.5,0.22,0.5,pathMat,doorX,0.20,D/2+1.05));
  g.add(box(1.5,0.22,0.5,pathMat,doorX,0.02,D/2+0.75));

  // window boxes with flowers
  const flowerMat = new THREE.MeshStandardMaterial({color:0xe86a7a, roughness:0.8});
  [-1.35,1.35].forEach(fx=>{
    g.add(box(1.0,0.22,0.28,whiteMat,fx,upY-0.95,D/2+0.22,false));
    g.add(box(0.85,0.18,0.2,flowerMat,fx,upY-0.78,D/2+0.22,false));
  });
  // hedge
  const hedge = box(1.8,0.55,0.55,new THREE.MeshStandardMaterial({color:0x5da24e, roughness:0.95}), bayX*0.6,0.55,D/2+1.55);
  g.add(hedge);

  scene.add(g);
  return g;
}
for(let i=0;i<7;i++) makeHouse(i);

// ---------- foreground trees & shrubs ----------
const treeDefs = [
  {x:-16,z:8,s:1.1},{x:-7,z:11,s:0.9},{x:3,z:9,s:1.2},{x:11,z:12,s:0.85},{x:18,z:8,s:1.05},{x:-22,z:12,s:0.8}
];
treeDefs.forEach((t,idx)=>{
  const tr = makeTree(t.s, leafMats[idx%3]);
  tr.position.set(t.x, groundY(t.x,t.z), t.z);
  scene.add(tr);
  const shrub = new THREE.Mesh(new THREE.IcosahedronGeometry(0.55*t.s,1), leafMats[(idx+1)%3]);
  shrub.position.set(t.x+1.1*t.s, groundY(t.x,t.z)+0.35*t.s, t.z+0.4); shrub.castShadow=true; scene.add(shrub);
});

// ---------- interaction (drag orbit + wheel zoom) ----------
let dragging=false, lastX=0, lastY=0;
const el = renderer.domElement;
el.addEventListener('pointerdown', e=>{ dragging=true; lastX=e.clientX; lastY=e.clientY; el.setPointerCapture(e.pointerId); });
el.addEventListener('pointermove', e=>{
  if(!dragging) return;
  const dx=e.clientX-lastX, dy=e.clientY-lastY; lastX=e.clientX; lastY=e.clientY;
  theta -= dx*0.005; phi -= dy*0.005;
  updateCamera(); renderer.render(scene,camera);
});
el.addEventListener('pointerup', e=>{ dragging=false; });
el.addEventListener('pointercancel', ()=>{ dragging=false; });
el.addEventListener('wheel', e=>{
  e.preventDefault();
  radius *= Math.exp(e.deltaY*0.001);
  updateCamera(); renderer.render(scene,camera);
},{passive:false});

// ---------- resize & render ----------
function onResize(){
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.5));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.render(scene,camera);
}
window.addEventListener('resize', onResize);

renderer.render(scene,camera);
window.sceneReady = true;
</script>
</body>
</html>
