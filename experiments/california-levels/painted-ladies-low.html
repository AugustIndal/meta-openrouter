<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Houses on a Hill</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#a9c9e8;}
  canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab;}
  canvas:active{cursor:grabbing;}
</style>
<script type="importmap">
{"imports":{"three":"./three.module.js"}}
</script>
</head>
<body>
<script type="module">
import * as THREE from './three.module.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xa8c9e8);

const camera = new THREE.PerspectiveCamera(38, 1200/800, 0.1, 200);
const renderer = new THREE.WebGLRenderer({antialias:true, powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 1.5));
renderer.setSize(1200, 800, false);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const hemi = new THREE.HemisphereLight(0xcfe4ff, 0x7d9a68, 1.05);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff2d8, 2.2);
sun.position.set(11, 19, 14);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -22; sun.shadow.camera.right = 22;
sun.shadow.camera.top = 22; sun.shadow.camera.bottom = -18;
sun.shadow.camera.near = 1; sun.shadow.camera.far = 60;
sun.shadow.bias = -0.0004;
scene.add(sun);
const fill = new THREE.DirectionalLight(0xbcd4ff, 0.45);
fill.position.set(-10, 8, -6);
scene.add(fill);

function mat(color, rough=0.85, metal=0.0){
  return new THREE.MeshStandardMaterial({color, roughness:rough, metalness:metal});
}
const whiteMat = mat(0xf7f3e8, 0.65);
const glassMat = new THREE.MeshStandardMaterial({color:0x2e4a5e, roughness:0.22, metalness:0.35, emissive:0x1a2f3e, emissiveIntensity:0.25});
const darkGlass = mat(0x243b4d, 0.3, 0.2);
const woodMat = mat(0x6b4a35, 0.8);
const doorMats = [0x7a2f2f,0x2f4f6b,0x355e3f,0x6b3a5e,0x7a5520,0x324a6b,0x5e3a2f].map(c=>mat(c,0.7));

function box(w,h,d,x,y,z,material,parent=scene,shadow=true){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), material);
  m.position.set(x,y,z);
  m.castShadow = shadow; m.receiveShadow = true;
  parent.add(m); return m;
}
function gableRoof(w,h,d,material){
  const shape = new THREE.Shape();
  shape.moveTo(-w/2,0); shape.lineTo(w/2,0); shape.lineTo(0,h); shape.lineTo(-w/2,0);
  const geo = new THREE.ExtrudeGeometry(shape,{depth:d, bevelEnabled:false});
  geo.translate(0,0,-d/2);
  const m = new THREE.Mesh(geo, material);
  m.castShadow = true; m.receiveShadow = true;
  return m;
}

// Sky clouds - soft white clusters
const cloudMat = mat(0xffffff, 1.0);
[[-14,13,-22,3.2],[ -5,15,-24,4.0],[6,14,-23,3.6],[15,16,-25,4.4],[0,17,-27,5.2]].forEach(([x,y,z,s])=>{
  const g = new THREE.Group();
  const a = new THREE.Mesh(new THREE.SphereGeometry(s*0.55,16,12), cloudMat); a.scale.set(1.6,0.55,1);
  const b = new THREE.Mesh(new THREE.SphereGeometry(s*0.42,14,10), cloudMat); b.position.set(s*0.7,s*0.12,0); b.scale.set(1.3,0.5,1);
  const c = new THREE.Mesh(new THREE.SphereGeometry(s*0.38,14,10), cloudMat); c.position.set(-s*0.65,s*0.08,0.2); c.scale.set(1.2,0.5,1);
  [a,b,c].forEach(m=>{m.castShadow=false;m.receiveShadow=false;g.add(m);});
  g.position.set(x,y,z); scene.add(g);
});

// Distant modern high-rises behind rooftops
function facadeTexture(base, win){
  const cv = document.createElement('canvas'); cv.width=128; cv.height=256;
  const ctx = cv.getContext('2d'); ctx.fillStyle=base; ctx.fillRect(0,0,128,256);
  ctx.fillStyle=win;
  for(let y=12;y<248;y+=20) for(let x=8;x<120;x+=18) ctx.fillRect(x,y,10,11);
  const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const towers = [
  [-16,7,-16,5,14,5,'#8fa3b5','#d8e6ef'],[-9,9,-18,6,18,6,'#7d95ad','#e6f0f7'],
  [-2,6,-15,5,12,5,'#9aaebe','#eef4f8'],[5,10,-17,6,20,6,'#8298ae','#dbe9f2'],
  [12,7,-15,5,14,5,'#8fa3b5','#e6f0f7'],[18,8,-18,6,16,6,'#798fa6','#d8e6ef'],
  [0,12,-22,7,24,7,'#6f89a3','#eaf2f8']
];
towers.forEach(([x,h,z,w,hh,d,base,win])=>{
  const tex = facadeTexture(base,win);
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,hh,d), new THREE.MeshStandardMaterial({map:tex, roughness:0.6, metalness:0.15}));
  m.position.set(x, hh/2 - 0.5, z); m.castShadow=false; m.receiveShadow=false; scene.add(m);
  const cap = box(w+0.3,0.3,d+0.3,x,hh-0.35,z,mat(0xe8eef2,0.6),scene,false);
});

// Ground platform / street
const platform = box(34,0.6,7.5, 0,0.3,0.5, mat(0x9a958c,0.95));
box(34,0.12,1.2, 0,0.65,4.1, mat(0xb8b2a6,0.95));
box(34,0.06,0.35, 0,0.68,2.6, mat(0xf0ead8,0.9), scene, false);
// Grassy hillside foreground (sloping down toward viewer)
const grassGeo = new THREE.PlaneGeometry(44,16,28,10);
grassGeo.rotateX(-Math.PI/2);
const pos = grassGeo.attributes.position;
for(let i=0;i<pos.count;i++){
  const x=pos.getX(i), z=pos.getZ(i);
  const slope = (z+8)*0.14;
  const und = Math.sin(x*0.55)*0.18 + Math.cos(x*0.3+1.2)*0.12;
  pos.setY(i, -slope - 0.4 + und*0.35);
}
grassGeo.computeVertexNormals();
const grass = new THREE.Mesh(grassGeo, mat(0x6fae56,1.0));
grass.position.set(0,0.55,11.5); grass.receiveShadow=true; scene.add(grass);
// side grass banks
const bankGeo = new THREE.PlaneGeometry(14,18,10,10); bankGeo.rotateX(-Math.PI/2);
const bp=bankGeo.attributes.position;
for(let i=0;i<bp.count;i++){ const x=bp.getX(i),z=bp.getZ(i); bp.setY(i, Math.abs(x)*0.12 + Math.sin(z)*0.15); }
bankGeo.computeVertexNormals();
const bankL=new THREE.Mesh(bankGeo,mat(0x679f50,1)); bankL.position.set(-20,0.2,4); bankL.receiveShadow=true; scene.add(bankL);
const bankR=bankL.clone(); bankR.position.x=20; scene.add(bankR);

// Houses
const pastel = [0xf2c9b8,0xf7e3a1,0xb8d9c8,0xf3b8c6,0xb8c9e8,0xe8d0a8,0xc9b8e8];
const roofCols = [0x7a4a4a,0x4a6b7a,0x5e4a6b,0x6b4a3a,0x3f5e4a,0x7a5e3a,0x4a4a6b];
const spacing = 3.35;
for(let idx=0; idx<7; idx++){
  const x = (idx-3)*spacing + (idx%2===0?0.06:-0.05);
  const house = new THREE.Group(); house.position.set(x,0.6,0.2); scene.add(house);
  const bodyMat = mat(pastel[idx],0.85);
  const roofMat = mat(roofCols[idx],0.75);
  const W=2.9, H=4.6, D=3.0;
  // main body
  box(W,H,D, 0,H/2,0, bodyMat, house);
  // side return / rear depth hint
  box(W*0.96,H*0.92,0.6, 0,H*0.46,-D/2-0.25, bodyMat, house);
  // white corner trim
  box(0.14,H,0.14, -W/2+0.07,H/2,D/2-0.02, whiteMat, house);
  box(0.14,H,0.14,  W/2-0.07,H/2,D/2-0.02, whiteMat, house);
  // horizontal trim bands
  box(W+0.12,0.18,0.1, 0,2.55,D/2+0.02, whiteMat, house);
  box(W+0.16,0.22,0.14, 0,H-0.08,D/2+0.02, whiteMat, house);
  box(W+0.2,0.16,0.18, 0,0.18,D/2+0.02, whiteMat, house);
  // steep gable roof (front facing)
  const roof = gableRoof(W+0.5, 2.15, D+0.55, roofMat);
  roof.position.set(0,H,0); roof.castShadow=true; house.add(roof);
  // roof side planes subtle: add ridge
  box(0.18,0.18,D+0.6, 0,H+2.12,0, whiteMat, house);
  // gable infill triangle panel (white trim outline approximated)
  const gable = gableRoof(W-0.35,1.85,0.08, bodyMat); gable.position.set(0,H+0.02,D/2+0.08); house.add(gable);
  // decorative gable trim - small angled boxes simulated with vertical + horizontal
  box(0.12,1.15,0.12, 0,H+0.75,D/2+0.16, whiteMat, house);
  box(0.5,0.12,0.12, 0,H+1.28,D/2+0.16, whiteMat, house);
  // chimney
  box(0.45,1.1,0.45, 0.85,H+1.45,-0.6, mat(0x9a6a5a,0.9), house);
  box(0.6,0.15,0.6, 0.85,H+2.0,-0.6, whiteMat, house);
  // Bay window - two storey protrusion
  const bayW=1.7, bayH=3.4, bayD=0.75;
  box(bayW,bayH,bayD, 0,bayH/2+0.25,D/2+bayD/2-0.05, bodyMat, house);
  box(bayW+0.2,0.18,bayD+0.15, 0,3.75,D/2+bayD/2, whiteMat, house);
  box(bayW+0.24,0.2,bayD+0.2, 0,0.28,D/2+bayD/2, whiteMat, house);
  // bay windows glass + frames (front and sides)
  function bayWin(w,h,x,y,z,ry){
    const g=new THREE.Group(); g.position.set(x,y,z); g.rotation.y=ry; house.add(g);
    box(w+0.18,h+0.18,0.08, 0,0,0, whiteMat, g);
    const gl=box(w,h,0.1, 0,0,0.02, glassMat, g, false); gl.castShadow=false;
    box(w+0.24,0.09,0.14, 0,h/2+0.12,0, whiteMat, g);
    box(w+0.24,0.09,0.14, 0,-h/2-0.12,0, whiteMat, g);
    box(0.07,h,0.12, 0,0,0.03, whiteMat, g);
    return g;
  }
  bayWin(1.25,1.35, 0,2.95, D/2+bayD+0.02, 0);
  bayWin(1.25,1.25, 0,1.45, D/2+bayD+0.02, 0);
  bayWin(0.55,1.3, -bayW/2-0.02,2.95, D/2+0.35, Math.PI/2);
  bayWin(0.55,1.3,  bayW/2+0.02,2.95, D/2+0.35, Math.PI/2);
  bayWin(0.55,1.2, -bayW/2-0.02,1.45, D/2+0.35, Math.PI/2);
  bayWin(0.55,1.2,  bayW/2+0.02,1.45, D/2+0.35, Math.PI/2);
  // upper side windows
  [-1.05,1.05].forEach(sx=>{
    box(0.62,1.0,0.08, sx,3.7,D/2+0.03, whiteMat, house);
    const gl=box(0.5,0.88,0.1, sx,3.7,D/2+0.05, glassMat, house,false); gl.castShadow=false;
    box(0.07,0.88,0.12, sx,3.7,D/2+0.06, whiteMat, house);
  });
  // door on right side of bay
  const doorX = 1.08;
  box(0.72,1.65,0.1, doorX,0.95,D/2+0.04, whiteMat, house);
  box(0.6,1.52,0.12, doorX,0.95,D/2+0.06, doorMats[idx], house);
  box(0.34,0.45,0.04, doorX,1.28,D/2+0.13, glassMat, house,false);
  box(0.08,0.08,0.06, doorX+0.18,0.95,D/2+0.14, mat(0xd9b84a,0.3,0.7), house,false);
  // porch / steps
  box(1.3,0.14,0.9, doorX,1.78,D/2+0.45, roofMat, house);
  box(0.08,0.5,0.08, doorX-0.55,1.5,D/2+0.75, whiteMat, house);
  box(0.08,0.5,0.08, doorX+0.55,1.5,D/2+0.75, whiteMat, house);
  box(1.2,0.22,0.55, doorX,0.11,D/2+0.55, mat(0xb8b2a6,0.95), house);
  box(1.4,0.22,0.75, doorX,0.32,D/2+0.45, mat(0xc4beb2,0.95), house);
  box(1.1,0.22,0.45, doorX,0.53,D/2+0.35, mat(0xc4beb2,0.95), house);
  // small flower boxes under bay
  box(1.3,0.22,0.22, 0,2.18,D/2+bayD+0.12, woodMat, house);
  for(let f=0;f<5;f++) box(0.18,0.18,0.18, -0.5+f*0.25,2.32,D/2+bayD+0.12, mat(f%2?0xe86a7a:0x7ab86a,0.9), house,false);
}

// Trees in foreground / sides
const trunkMat = mat(0x6b4a35,0.95);
const leafMats = [mat(0x4f8a3f,1),mat(0x6aa84f,1),mat(0x3f7a34,1)];
function tree(x,z,s){
  const g=new THREE.Group(); g.position.set(x,0.4,z); g.scale.setScalar(s); scene.add(g);
  const tr=new THREE.Mesh(new THREE.CylinderGeometry(0.12,0.18,1.2,8), trunkMat); tr.position.y=0.6; tr.castShadow=true; g.add(tr);
  const lm=leafMats[Math.abs(Math.round(x))%3];
  const s1=new THREE.Mesh(new THREE.SphereGeometry(0.85,14,10), lm); s1.position.y=1.6; s1.castShadow=true; g.add(s1);
  const s2=new THREE.Mesh(new THREE.SphereGeometry(0.6,12,9), lm); s2.position.set(0.5,1.35,0.2); s2.castShadow=true; g.add(s2);
  const s3=new THREE.Mesh(new THREE.SphereGeometry(0.55,12,9), lm); s3.position.set(-0.45,1.4,-0.15); s3.castShadow=true; g.add(s3);
}
tree(-13.5,5.2,1.1); tree(13.8,5.0,1.15); tree(-16,7.5,0.9); tree(16.5,8,0.95); tree(-11,2.8,0.75); tree(11.2,2.6,0.8);

// Camera orbit controls (pointer drag + wheel)
let theta = 0, phi = 1.18, radius = 27;
const target = new THREE.Vector3(0,2.6,0.5);
function updateCamera(){
  const sp = Math.sin(phi), cp = Math.cos(phi);
  camera.position.set(
    target.x + radius*sp*Math.sin(theta),
    target.y + radius*cp,
    target.z + radius*sp*Math.cos(theta)
  );
  camera.lookAt(target);
}
function render(){ renderer.render(scene,camera); }
let dragging=false, lastX=0, lastY=0, moved=false;
renderer.domElement.addEventListener('pointerdown', e=>{ dragging=true; moved=true; lastX=e.clientX; lastY=e.clientY; renderer.domElement.setPointerCapture(e.pointerId); });
renderer.domElement.addEventListener('pointermove', e=>{
  if(!dragging) return;
  const dx=e.clientX-lastX, dy=e.clientY-lastY; lastX=e.clientX; lastY=e.clientY;
  theta -= dx*0.006; phi -= dy*0.006;
  phi = Math.max(0.35, Math.min(1.45, phi));
  updateCamera(); render();
});
renderer.domElement.addEventListener('pointerup', ()=>{ dragging=false; });
renderer.domElement.addEventListener('pointercancel', ()=>{ dragging=false; });
renderer.domElement.addEventListener('wheel', e=>{
  e.preventDefault();
  radius = Math.max(13, Math.min(42, radius + e.deltaY*0.03));
  updateCamera(); render();
},{passive:false});

function onResize(){
  const w=window.innerWidth, h=window.innerHeight;
  camera.aspect=w/h; camera.updateProjectionMatrix();
  renderer.setSize(w,h,false);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.5));
  render();
}
window.addEventListener('resize', onResize);

updateCamera();
render();
window.sceneReady = true;
</script>
</body>
</html>
