<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#8EB9DC"/>
<stop offset="0.32" stop-color="#C9D9E8"/>
<stop offset="0.55" stop-color="#F6D9A6"/>
<stop offset="0.78" stop-color="#FFB57E"/>
<stop offset="1" stop-color="#FF9A6B"/>
</linearGradient>
<linearGradient id="ocean" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#4AA99E"/>
<stop offset="0.25" stop-color="#2E8A96"/>
<stop offset="0.6" stop-color="#1D6490"/>
<stop offset="1" stop-color="#123E66"/>
</linearGradient>
<linearGradient id="orangeTower" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#F06A3B"/>
<stop offset="0.5" stop-color="#D94A2A"/>
<stop offset="1" stop-color="#A9321E"/>
</linearGradient>
<linearGradient id="orangeTower2" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#EA6740"/>
<stop offset="1" stop-color="#9E2F1D"/>
</linearGradient>
<linearGradient id="farHill" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#9B8FB0"/>
<stop offset="1" stop-color="#6E7396"/>
</linearGradient>
<linearGradient id="midHill" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#7A8A8E"/>
<stop offset="1" stop-color="#4E6068"/>
</linearGradient>
<linearGradient id="fgHill" x1="0" y1="0" x2="0.7" y2="1">
<stop offset="0" stop-color="#7A6A3E"/>
<stop offset="0.45" stop-color="#55603A"/>
<stop offset="1" stop-color="#2E3524"/>
</linearGradient>
<radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
<stop offset="0" stop-color="#FFF3B8" stop-opacity="0.95"/>
<stop offset="0.25" stop-color="#FFD98A" stop-opacity="0.75"/>
<stop offset="0.6" stop-color="#FF9E6B" stop-opacity="0.28"/>
<stop offset="1" stop-color="#FF9E6B" stop-opacity="0"/>
</radialGradient>
<radialGradient id="sunCore" cx="0.5" cy="0.5" r="0.5">
<stop offset="0" stop-color="#FFF8D0"/>
<stop offset="0.7" stop-color="#FFE29A"/>
<stop offset="1" stop-color="#FFC36B"/>
</radialGradient>
<filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="9"/></filter>
<filter id="soft2" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="18"/></filter>
<filter id="softSmall" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3"/></filter>
</defs>

<!-- SKY -->
<rect width="1200" height="800" fill="url(#sky)"/>
<circle cx="455" cy="395" r="265" fill="url(#sunGlow)"/>
<circle cx="455" cy="395" r="52" fill="url(#sunCore)" opacity="0.95"/>

