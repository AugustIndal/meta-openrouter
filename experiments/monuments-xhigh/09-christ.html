<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Christ the Redeemer - Clay Maquette</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#e8e6df}
canvas{display:block;width:100vw;height:100vh;touch-action:none}
</style>
</head>
<body>
<script type="module">
import * as THREE from './three.module.js';

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio,1.5));
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.06;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xe8e6df);
scene.fog = new THREE.Fog(0xe8e6df,85,150);

const camera = new THREE.PerspectiveCamera(38,window.innerWidth/window.innerHeight,0.1,300);

const clay = new THREE.MeshStandardMaterial({color:0xeee7d8,roughness:0.9,metalness:0});
const clayDark = new THREE.MeshStandardMaterial({color:0xe4dac8,roughness:0.92,metalness:0});
const pedestalMat = new THREE.MeshStandardMaterial({color:0xe1dacb,roughness:0.94,metalness:0});
const boardMat = new THREE.MeshStandardMaterial({color:0xd8d3c2,roughness:0.96,metalness:0});
const groundMat = new THREE.MeshStandardMaterial({color:0xb7bdb0,roughness:1,metalness:0});

function shadowed(mesh){mesh.castShadow=true;mesh.receiveShadow=true;return mesh;}

// Lights - museum lighting
scene.add(new THREE.HemisphereLight(0xfff6e8,0x8a9184,0.95));
const key = new THREE.DirectionalLight(0xfff0d8,2.4);
key.position.set(20,34,22);
key.castShadow = true;
key.shadow.mapSize.set(2048,2048);
key.shadow.camera.left=-32;key.shadow.camera.right=32;key.shadow.camera.top=34;key.shadow.camera.bottom=-20;
key.shadow.camera.near=5;key.shadow.camera.far=90;key.shadow.bias=-0.0004;
key.target.position.set(0,10,0);
scene.add(key);scene.add(key.target);
const fill = new THREE.DirectionalLight(0xdfe8ff,0.7);
fill.position.set(-22,16,-8);scene.add(fill);
const front = new THREE.DirectionalLight(0xffffff,0.45);
front.position.set(4,14,34);scene.add(front);

// Ground and maquette board
const ground = shadowed(new THREE.Mesh(new THREE.CircleGeometry(95,48),groundMat));
ground.rotation.x=-Math.PI/2;ground.position.y=0;scene.add(ground);
const board = shadowed(new THREE.Mesh(new THREE.CylinderGeometry(21.5,22.2,1.0,56),boardMat));
board.position.y=0.5;scene.add(board);
const boardTrim = shadowed(new THREE.Mesh(new THREE.CylinderGeometry(19.8,19.8,0.35,56),pedestalMat));
boardTrim.position.y=1.05;scene.add(boardTrim);

// Distant soft hills (behind, never in front)
const hillMat = new THREE.MeshStandardMaterial({color:0x9ba695,roughness:1,flatShading:true});
[[-30,-22,13],[29,-19,11],[0,-32,16]].forEach((h,i)=>{
  const m=shadowed(new THREE.Mesh(new THREE.SphereGeometry(h[2],24,12),hillMat));
  m.position.set(h[0],0,h[1]);m.scale.set(1.4,0.34,1);scene.add(m);
});

// Corcovado mountain - layered green-gray tiers
const mountainMats=[0x7e8a7a,0x74826f,0x879385,0x6d7c6a,0x82907e,0x77856f].map(c=>new THREE.MeshStandardMaterial({color:c,roughness:1,flatShading:true}));
function makeTier(rb,rt,h,y,seed,mat){
  const geo=new THREE.CylinderGeometry(rt,rb,h,42,3,false);
  const p=geo.attributes.position;
  for(let i=0;i<p.count;i++){
    const x=p.getX(i),z=p.getZ(i),r=Math.hypot(x,z);
    if(r>0.01){
      const a=Math.atan2(z,x);
      const f=1+0.045*Math.sin(a*5+seed)+0.03*Math.sin(a*11+seed*1.7)+0.015*Math.sin(a*23+seed);
      p.setX(i,x*f);p.setZ(i,z*f);
    }
  }
  geo.computeVertexNormals();
  const m=shadowed(new THREE.Mesh(geo,mat));m.position.y=y;return m;
}
const tiers=[
 [19,15.8,3.0,2.5,0.4],[15.8,12.8,3.0,3.7,1.9],[12.8,10.2,3.0,4.9,3.1],[10.2,8.0,2.8,6.1,4.6],[8.0,6.4,2.6,7.4,6.0],[6.4,6.0,1.4,8.5,7.7]
];
tiers.forEach((t,i)=>scene.add(makeTier(t[0],t[1],t[2],t[3],t[4],mountainMats[i%mountainMats.length])));

// Side rocks / outcrops
const rockMat=new THREE.MeshStandardMaterial({color:0x7c8978,roughness:1,flatShading:true});
[[-14.5,1.6,-5.5,1.7],[15,1.8,-4,2.0],[-11,1.3,8,1.2],[13.5,1.2,7.5,1.1]].forEach(r=>{
  const m=shadowed(new THREE.Mesh(new THREE.DodecahedronGeometry(r[3],0),rockMat));
  m.position.set(r[0],r[1],r[2]);m.scale.set(1.3,0.75,1);m.rotation.set(r[2]*0.1,0.4,r[0]*0.05);scene.add(m);
});

// Pedestal - stepped square
function box(w,h,d,y,mat){
  const m=shadowed(new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat||pedestalMat));m.position.y=y;return m;
}
scene.add(box(7.6,0.8,7.6,9.6));
scene.add(box(6.1,2.0,6.1,11.0));
scene.add(box(4.8,1.0,4.8,12.5));

// Statue group
const statue=new THREE.Group();statue.position.y=13.0;scene.add(statue);

// Robe - lathe with flowing vertical folds
const profile=[[0.02,0],[2.05,0],[2.0,0.4],[1.82,1.4],[1.62,2.8],[1.48,4.2],[1.35,5.6],[1.22,6.9],[1.02,7.7],[0.62,8.05],[0.38,8.2],[0.02,8.25]].map(p=>new THREE.Vector2(p[0],p[1]));
const robeGeo=new THREE.LatheGeometry(profile,38);
{
  const p=robeGeo.attributes.position;
  for(let i=0;i<p.count;i++){
    const x=p.getX(i),y=p.getY(i),z=p.getZ(i),r=Math.hypot(x,z);
    if(r>0.02){
      const a=Math.atan2(z,x),yn=y/8.25;
      const f=1+0.055*Math.sin(a*16+yn*0.9)+0.028*Math.sin(a*7+1.2);
      p.setX(i,x*f);p.setZ(i,z*f);
    }
  }
  robeGeo.computeVertexNormals();
}
statue.add(shadowed(new THREE.Mesh(robeGeo,clay)));

// Vertical robe fold ridges
for(let i=0;i<14;i++){
  const a=(i/14)*Math.PI*2+0.12;
  const m=shadowed(new THREE.Mesh(new THREE.BoxGeometry(0.16,4.6,0.14),clay));
  m.position.set(Math.sin(a)*1.58,2.3,Math.cos(a)*1.58);m.rotation.y=a;statue.add(m);
}
// Lower hem
const hem=shadowed(new THREE.Mesh(new THREE.TorusGeometry(1.92,0.11,10,42),clay));
hem.rotation.x=Math.PI/2;hem.position.y=0.35;hem.scale.set(1,1,0.6);statue.add(hem);

// Chest / shoulders
const chest=shadowed(new THREE.Mesh(new THREE.SphereGeometry(1.0,26,18),clay));
chest.position.set(0,7.25,0);chest.scale.set(1.08,0.85,0.82);statue.add(chest);
[-1,1].forEach(s=>{
  const sh=shadowed(new THREE.Mesh(new THREE.SphereGeometry(0.48,18,14),clay));
  sh.position.set(s*0.86,7.7,0);statue.add(sh);
});
// Diagonal sash band across chest
const sash=shadowed(new THREE.Mesh(new THREE.TorusGeometry(1.08,0.13,10,34),clayDark));
sash.position.set(0,6.75,0.05);sash.rotation.set(Math.PI/2-0.42,0,0.45);statue.add(sash);

// Arms fully outstretched horizontally
function makeArm(side){
  const g=new THREE.Group();g.position.set(side*0.82,7.65,0);statue.add(g);
  const armGeo=new THREE.CylinderGeometry(0.20,0.37,4.5,20);
  const arm=shadowed(new THREE.Mesh(armGeo,clay));
  arm.rotation.z=-side*Math.PI/2;arm.position.set(side*2.25,0,0);g.add(arm);
  const sleeve=shadowed(new THREE.Mesh(new THREE.CylinderGeometry(0.32,0.60,1.9,18),clay));
  sleeve.position.set(side*1.0,-0.85,0);sleeve.rotation.z=-side*0.14;g.add(sleeve);
  const elbow=shadowed(new THREE.Mesh(new THREE.SphereGeometry(0.27,14,10),clay));
  elbow.position.set(side*1.65,0,0);g.add(elbow);
  // Hand
  const hand=new THREE.Group();hand.position.set(side*4.65,0,0);g.add(hand);
  const palm=shadowed(new THREE.Mesh(new THREE.SphereGeometry(0.32,16,12),clay));
  palm.scale.set(1.6,0.45,1.15);palm.position.set(side*0.22,0,0);hand.add(palm);
  for(let i=0;i<4;i++){
    const f=shadowed(new THREE.Mesh(new THREE.CylinderGeometry(0.045,0.04,0.52,8),clay));
    f.rotation.z=-side*Math.PI/2;f.position.set(side*0.78,0,-0.19+i*0.125);hand.add(f);
  }
  const thumb=shadowed(new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.045,0.36,8),clay));
  thumb.rotation.x=Math.PI/2;thumb.position.set(side*0.15,-0.02,0.38);hand.add(thumb);
  return g;
}
makeArm(1);makeArm(-1);

// Neck, head, hair, face
const neck=shadowed(new THREE.Mesh(new THREE.CylinderGeometry(0.27,0.34,0.7,16),clay));
neck.position.y=8.35;statue.add(neck);
const head=shadowed(new THREE.Mesh(new THREE.SphereGeometry(0.62,26,20),clay));
head.position.y=9.28;head.scale.set(0.95,1.12,0.98);statue.add(head);
const hair=shadowed(new THREE.Mesh(new THREE.SphereGeometry(0.66,26,14,0,Math.PI*2,0,Math.PI*0.58),clayDark));
hair.position.y=9.36;hair.scale.set(1.0,1.05,1.0);statue.add(hair);
const nose=shadowed(new THREE.Mesh(new THREE.ConeGeometry(0.09,0.28,10),clay));
nose.rotation.x=Math.PI/2;nose.position.set(0,9.28,0.62);statue.add(nose);
[-1,1].forEach(s=>{
  const ear=shadowed(new THREE.Mesh(new THREE.SphereGeometry(0.12,10,8),clay));
  ear.position.set(s*0.58,9.32,0);statue.add(ear);
});

// Orbit controls (native pointer + wheel)
const target=new THREE.Vector3(0,11.5,0);
const orbit={radius:52,theta:0.44,phi:1.32};
function updateCamera(){
  orbit.phi=Math.max(0.35,Math.min(1.5,orbit.phi));
  orbit.radius=Math.max(22,Math.min(85,orbit.radius));
  const sp=Math.sin(orbit.phi),cp=Math.cos(orbit.phi);
  camera.position.set(
    target.x+orbit.radius*sp*Math.sin(orbit.theta),
    target.y+orbit.radius*cp,
    target.z+orbit.radius*sp*Math.cos(orbit.theta)
  );
  camera.lookAt(target);
}
function render(){renderer.render(scene,camera);}

let dragging=false,lastX=0,lastY=0;
const cv=renderer.domElement;
cv.addEventListener('pointerdown',e=>{dragging=true;lastX=e.clientX;lastY=e.clientY;try{cv.setPointerCapture(e.pointerId);}catch(_){}});
cv.addEventListener('pointermove',e=>{
  if(!dragging)return;
  orbit.theta-=(e.clientX-lastX)*0.005;
  orbit.phi-=(e.clientY-lastY)*0.005;
  lastX=e.clientX;lastY=e.clientY;updateCamera();render();
});
cv.addEventListener('pointerup',()=>{dragging=false;});
cv.addEventListener('pointercancel',()=>{dragging=false;});
cv.addEventListener('wheel',e=>{
  e.preventDefault();
  orbit.radius*=1+e.deltaY*0.001;updateCamera();render();
},{passive:false});

function onResize(){
  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth,window.innerHeight);
  render();
}
window.addEventListener('resize',onResize);

updateCamera();
render();
window.sceneReady=true;
</script>
</body>
</html>
